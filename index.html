<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>AstroSnap — Astrophotography Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-void:#05070f;
  --bg-deep:#0a0e1f;
  --bg-panel:#0d1226;
  --glass:rgba(20,26,50,0.55);
  --glass-border:rgba(139,148,255,0.14);
  --glass-border-hi:rgba(139,148,255,0.30);
  --blue:#5b8def;
  --violet:#8b5cf6;
  --amber:#f5a623;
  --amber-dim:#d68f1a;
  --green:#4ade80;
  --red:#f87171;
  --text-hi:#f1f3fb;
  --text-mid:#aab0cc;
  --text-low:#6b7291;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg-void);overscroll-behavior:none;}
body{
  font-family:var(--font-body);
  color:var(--text-hi);
  -webkit-font-smoothing:antialiased;
  position:relative;
  min-height:100vh;
  min-height:100dvh;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
}

/* ===== Starfield background ===== */
#starfield{position:fixed;inset:0;z-index:0;background:
  radial-gradient(ellipse 120% 80% at 50% -10%, rgba(91,141,239,0.10), transparent 60%),
  radial-gradient(ellipse 100% 60% at 20% 110%, rgba(139,92,246,0.08), transparent 60%),
  linear-gradient(180deg, var(--bg-void) 0%, var(--bg-deep) 45%, #060815 100%);
}
#starfield canvas{position:absolute;inset:0;width:100%;height:100%;}

/* ===== App shell ===== */
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
.screen{display:none;flex:1;flex-direction:column;padding:0 18px calc(96px + env(safe-area-inset-bottom)) 18px;animation:screenIn 0.35s ease both;}
.screen.active{display:flex;}
@keyframes screenIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ===== Top bar ===== */
.topbar{position:sticky;top:0;z-index:5;padding:calc(14px + env(safe-area-inset-top)) 18px 10px 18px;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(16px);background:linear-gradient(180deg, rgba(5,7,15,0.85), rgba(5,7,15,0));}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:0.06em;color:var(--text-hi);}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber);}
.topbar-actions{display:flex;gap:10px;align-items:center;}
.icon-btn{width:34px;height:34px;border-radius:11px;background:var(--glass);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text-mid);cursor:pointer;}

/* ===== Glass card system ===== */
.card{background:var(--glass);border:1px solid var(--glass-border);border-radius:20px;padding:18px;backdrop-filter:blur(20px);position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg, rgba(255,255,255,0.04), transparent 40%);pointer-events:none;}
.card + .card{margin-top:12px;}
.section-gap{margin-top:20px;}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-low);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.h1{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-0.01em;margin:0;}
.h2{font-family:var(--font-display);font-weight:600;font-size:18px;margin:0 0 12px 0;letter-spacing:-0.005em;}
.muted{color:var(--text-mid);font-size:14px;line-height:1.5;}
.data{font-family:var(--font-mono);}

/* ===== Buttons ===== */
.btn{border:none;border-radius:14px;padding:15px 20px;font-family:var(--font-body);font-weight:600;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform 0.12s ease, filter 0.12s ease;width:100%;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:linear-gradient(135deg, var(--blue), var(--violet));color:#fff;box-shadow:0 8px 24px -8px rgba(91,141,239,0.5);}
.btn-primary:disabled{opacity:0.45;filter:grayscale(0.4);}
.btn-ghost{background:var(--glass);border:1px solid var(--glass-border);color:var(--text-hi);}
.btn-amber{background:linear-gradient(135deg, var(--amber), var(--amber-dim));color:#1a1206;box-shadow:0 8px 24px -8px rgba(245,166,35,0.4);}
.btn-sm{padding:10px 14px;font-size:13px;border-radius:11px;width:auto;}
.btn-danger{background:rgba(248,113,113,0.12);color:var(--red);border:1px solid rgba(248,113,113,0.3);}

/* ===== Bottom nav ===== */
#bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:0 16px calc(14px + env(safe-area-inset-bottom)) 16px;pointer-events:none;}
.navbar{pointer-events:auto;max-width:488px;width:100%;background:rgba(13,18,38,0.85);backdrop-filter:blur(24px);border:1px solid var(--glass-border);border-radius:22px;display:flex;padding:8px;gap:4px;box-shadow:0 12px 40px -12px rgba(0,0,0,0.6);}
.navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border-radius:16px;cursor:pointer;color:var(--text-low);transition:all 0.2s ease;}
.navitem .navicon{font-size:19px;line-height:1;filter:grayscale(1) opacity(0.6);transition:filter 0.2s ease;}
.navitem .navlabel{font-size:10px;font-weight:600;letter-spacing:0.02em;}
.navitem.active{color:var(--text-hi);background:linear-gradient(135deg, rgba(91,141,239,0.18), rgba(139,92,246,0.18));}
.navitem.active .navicon{filter:none;}

/* ===== Onboarding ===== */
.onboard-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 20px;min-height:100vh;min-height:100dvh;}
.equip-card{border-radius:22px;padding:26px 20px;border:1.5px solid var(--glass-border);background:var(--glass);backdrop-filter:blur(20px);text-align:center;cursor:pointer;transition:all 0.2s ease;margin-bottom:14px;}
.equip-card:active{transform:scale(0.98);}
.equip-card.selected{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue), 0 12px 32px -10px rgba(91,141,239,0.4);}
.equip-icon{font-size:44px;margin-bottom:12px;display:block;}
.equip-title{font-family:var(--font-display);font-weight:700;font-size:19px;margin-bottom:6px;}
.equip-quote{color:var(--text-mid);font-size:13.5px;font-style:italic;line-height:1.4;}

/* ===== Progress dots ===== */
.progress-dots{display:flex;gap:6px;justify-content:center;margin-bottom:28px;}
.progress-dots span{width:6px;height:6px;border-radius:50%;background:var(--glass-border-hi);}
.progress-dots span.done{background:var(--blue);}

/* ===== Astro score gauge ===== */
.score-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.score-num{font-family:var(--font-display);font-size:34px;font-weight:700;}
.score-bar-track{height:9px;border-radius:6px;background:rgba(255,255,255,0.06);overflow:hidden;margin:10px 0 16px 0;}
.score-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg, var(--blue), var(--violet));transition:width 0.6s ease;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-chip{background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);border-radius:13px;padding:10px 12px;}
.stat-chip .label{font-size:11px;color:var(--text-low);margin-bottom:3px;}
.stat-chip .val{font-family:var(--font-mono);font-weight:600;font-size:14.5px;}

/* ===== Target rows ===== */
.target-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,0.05);}
.target-row:last-child{border-bottom:none;}
.target-icon{font-size:26px;width:38px;text-align:center;}
.target-info{flex:1;min-width:0;}
.target-name{font-weight:600;font-size:15px;}
.target-meta{font-size:12.5px;color:var(--text-mid);font-family:var(--font-mono);}
.quality-badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:8px;letter-spacing:0.02em;white-space:nowrap;}
.q-excellent{background:rgba(74,222,128,0.15);color:var(--green);}
.q-good{background:rgba(91,141,239,0.15);color:var(--blue);}
.q-fair{background:rgba(245,166,35,0.15);color:var(--amber);}
.q-poor{background:rgba(248,113,113,0.15);color:var(--red);}

/* ===== Cloud timeline ===== */
.cloud-timeline{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px 2px;scrollbar-width:none;}
.cloud-timeline::-webkit-scrollbar{display:none;}
.cloud-hour{flex:0 0 auto;width:52px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:14px;background:rgba(255,255,255,0.03);border:1px solid transparent;}
.cloud-hour.best{border-color:var(--green);background:rgba(74,222,128,0.08);}
.cloud-hour .time{font-family:var(--font-mono);font-size:10.5px;color:var(--text-low);}
.cloud-hour .pct{font-family:var(--font-mono);font-weight:700;font-size:13px;}
.cloud-bar-track{width:6px;height:44px;border-radius:4px;background:rgba(255,255,255,0.06);display:flex;align-items:flex-end;overflow:hidden;}
.cloud-bar-fill{width:100%;border-radius:4px;}

/* ===== Mission card ===== */
.mission-hero{border-radius:22px;padding:22px;background:linear-gradient(150deg, rgba(91,141,239,0.14), rgba(139,92,246,0.10));border:1px solid rgba(139,148,255,0.22);position:relative;overflow:hidden;}
.mission-hero.locked{background:linear-gradient(150deg, rgba(148,163,184,0.08), rgba(100,116,139,0.06));border-color:rgba(148,163,184,0.15);}
.mission-title{font-family:var(--font-display);font-weight:700;font-size:21px;margin:6px 0 4px 0;}
.mission-desc{color:var(--text-mid);font-size:13.5px;line-height:1.5;margin-bottom:14px;}
.mission-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;}
.stars{color:var(--amber);letter-spacing:2px;font-size:14px;}
.xp-pill{font-family:var(--font-mono);font-weight:700;font-size:13px;color:var(--amber);background:rgba(245,166,35,0.12);padding:5px 11px;border-radius:9px;}

/* ===== Mission list item ===== */
.mission-item{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-border);margin-bottom:10px;cursor:pointer;}
.mission-item.unavailable{opacity:0.55;}
.mission-item .micon{font-size:24px;}
.mission-item .mtext{flex:1;}
.mission-item .mname{font-weight:600;font-size:14.5px;}
.mission-item .msub{font-size:12px;color:var(--text-low);}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.status-dot.on{background:var(--green);box-shadow:0 0 8px var(--green);}
.status-dot.off{background:var(--text-low);}

/* ===== Forms ===== */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--text-mid);margin-bottom:6px;font-weight:600;}
.field select, .field input[type=text], .field input[type=number]{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--glass-border);border-radius:12px;padding:12px 14px;color:var(--text-hi);font-family:var(--font-body);font-size:14.5px;}
.field select:focus, .field input:focus{outline:2px solid var(--blue);outline-offset:1px;}
.slider-row{display:flex;align-items:center;gap:10px;}
input[type=range]{flex:1;accent-color:var(--blue);}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.switch{position:relative;width:44px;height:26px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider-toggle{position:absolute;inset:0;background:rgba(255,255,255,0.12);border-radius:14px;cursor:pointer;transition:0.2s;}
.slider-toggle::before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:0.2s;}
input:checked + .slider-toggle{background:var(--blue);}
input:checked + .slider-toggle::before{transform:translateX(18px);}

/* ===== Camera ===== */
.camera-wrap{position:relative;width:100%;aspect-ratio:3/4;border-radius:22px;overflow:hidden;background:#000;border:1px solid var(--glass-border);}
#camVideo, #camCanvasPreview{width:100%;height:100%;object-fit:cover;display:block;}
.camera-overlay{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 15%, transparent 80%, rgba(0,0,0,0.5) 100%);}
.camera-grid{position:absolute;inset:0;pointer-events:none;opacity:0.25;}
.camera-controls-strip{position:absolute;bottom:0;left:0;right:0;padding:16px;display:flex;align-items:center;justify-content:center;gap:20px;}
.shutter-btn{width:70px;height:70px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,0.35);cursor:pointer;}
.shutter-btn:active{transform:scale(0.92);}
.cam-side-btn{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,0.4);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;}

/* ===== Gallery ===== */
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.gallery-item{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:rgba(255,255,255,0.04);cursor:pointer;}
.gallery-item img{width:100%;height:100%;object-fit:cover;display:block;}
.gallery-badge{position:absolute;bottom:5px;left:5px;font-size:9.5px;background:rgba(0,0,0,0.6);padding:2px 6px;border-radius:6px;font-family:var(--font-mono);}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-low);}
.empty-state .eicon{font-size:40px;margin-bottom:12px;display:block;opacity:0.6;}

/* ===== Chips / filter row ===== */
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:20px;background:var(--glass);border:1px solid var(--glass-border);font-size:13px;font-weight:600;color:var(--text-mid);cursor:pointer;white-space:nowrap;}
.chip.active{background:linear-gradient(135deg, var(--blue), var(--violet));color:#fff;border-color:transparent;}

/* ===== Profile / XP ===== */
.level-ring{width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--blue) var(--pct,0%), rgba(255,255,255,0.08) 0);display:flex;align-items:center;justify-content:center;position:relative;margin:0 auto 12px auto;}
.level-ring::after{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--bg-deep);}
.level-ring .lvl-num{position:relative;z-index:1;font-family:var(--font-display);font-weight:700;font-size:24px;}
.achv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.achv{text-align:center;padding:10px 4px;border-radius:14px;background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);}
.achv.locked{opacity:0.3;}
.achv .aicon{font-size:22px;display:block;margin-bottom:4px;}
.achv .aname{font-size:9.5px;color:var(--text-mid);line-height:1.2;}

/* ===== Toast / modal ===== */
#toast-host{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:min(440px, calc(100% - 32px));pointer-events:none;}
.toast{background:rgba(15,20,42,0.95);border:1px solid var(--glass-border-hi);backdrop-filter:blur(20px);border-radius:14px;padding:12px 16px;font-size:13.5px;box-shadow:0 12px 32px -8px rgba(0,0,0,0.5);animation:toastIn 0.3s ease both;}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}

.modal-backdrop{position:fixed;inset:0;background:rgba(3,5,12,0.7);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn 0.2s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-sheet{width:100%;max-width:520px;background:var(--bg-panel);border-radius:26px 26px 0 0;border:1px solid var(--glass-border);border-bottom:none;padding:22px 20px calc(26px + env(safe-area-inset-bottom)) 20px;max-height:85vh;overflow-y:auto;animation:sheetUp 0.3s cubic-bezier(0.22,1,0.36,1);}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--glass-border-hi);margin:0 auto 16px auto;}

/* ===== Skeleton loading ===== */
.skel{background:linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.09) 37%, rgba(255,255,255,0.04) 63%);background-size:400% 100%;animation:skel 1.4s ease infinite;border-radius:8px;}
@keyframes skel{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ===== Misc ===== */
.divider{height:1px;background:rgba(255,255,255,0.06);margin:16px 0;}
.row-between{display:flex;align-items:center;justify-content:space-between;}
.last-updated{font-family:var(--font-mono);font-size:10.5px;color:var(--text-low);display:flex;align-items:center;gap:5px;}
.pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s ease infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.banner{border-radius:16px;padding:14px 16px;font-size:13.5px;line-height:1.5;display:flex;gap:10px;align-items:flex-start;}
.banner-info{background:rgba(91,141,239,0.10);border:1px solid rgba(91,141,239,0.25);}
.banner-warn{background:rgba(245,166,35,0.10);border:1px solid rgba(245,166,35,0.25);}
.banner-danger{background:rgba(248,113,113,0.10);border:1px solid rgba(248,113,113,0.25);}
.banner-ok{background:rgba(74,222,128,0.10);border:1px solid rgba(74,222,128,0.25);}
a.link{color:var(--blue);text-decoration:none;font-weight:600;}
</style>
</head>
<body>

<div id="starfield"><canvas id="skyCanvas"></canvas></div>
<div id="toast-host"></div>
<div id="modal-root"></div>

<div id="app">
  <!-- Screens injected by app.js -->
  <div id="screen-onboard-equip" class="screen"></div>
  <div id="screen-onboard-location" class="screen"></div>
  <div id="screen-home" class="screen"></div>
  <div id="screen-sky" class="screen"></div>
  <div id="screen-missions" class="screen"></div>
  <div id="screen-gallery" class="screen"></div>
  <div id="screen-profile" class="screen"></div>
  <div id="screen-capture" class="screen"></div>

  <div id="bottomnav" style="display:none;">
    <div class="navbar">
      <div class="navitem" data-nav="home"><div class="navicon">🏠</div><div class="navlabel">Home</div></div>
      <div class="navitem" data-nav="sky"><div class="navicon">🌌</div><div class="navlabel">Sky</div></div>
      <div class="navitem" data-nav="missions"><div class="navicon">🎯</div><div class="navlabel">Missions</div></div>
      <div class="navitem" data-nav="gallery"><div class="navicon">📸</div><div class="navlabel">Gallery</div></div>
      <div class="navitem" data-nav="profile"><div class="navicon">👤</div><div class="navlabel">Profile</div></div>
    </div>
  </div>
</div>

<script>
// AstroSnap Astronomy Engine
// Real algorithms: solar position (NOAA/SPA-simplified), lunar position (Meeus low-precision),
// moon phase/illumination, planet approximate positions (VSOP87-lite / Keplerian elements).
// No hardcoded "answers" - everything derives from lat/lon/date.

const AstroMath = (() => {
  const RAD = Math.PI / 180;
  const DEG = 180 / Math.PI;

  function toJulian(date) {
    return date.getTime() / 86400000 - 0.5 + 2440588;
  }
  function fromJulian(j) {
    return new Date((j + 0.5 - 2440588) * 86400000);
  }
  function toDays(date) {
    return toJulian(date) - 2451545.0; // days since J2000.0
  }

  // ---- Sun position (low precision, good to ~0.01deg, plenty for visibility calcs) ----
  function solarMeanAnomaly(d) {
    return RAD * (357.5291 + 0.98560028 * d);
  }
  function eclipticLongitude(M) {
    const C = RAD * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
    const P = RAD * 102.9372; // perihelion of Earth
    return M + C + P + Math.PI;
  }
  function obliquity(d) {
    return RAD * (23.4393 - 3.563e-7 * d);
  }
  function sunCoords(d) {
    const M = solarMeanAnomaly(d);
    const L = eclipticLongitude(M);
    const e = obliquity(d);
    return {
      dec: Math.asin(Math.sin(e) * Math.sin(L)),
      ra: Math.atan2(Math.sin(L) * Math.cos(e), Math.cos(L))
    };
  }

  function siderealTime(d, lw) {
    return RAD * (280.16 + 360.9856235 * d) - lw;
  }

  function altAz(H, dec, lat) {
    const phi = lat * RAD;
    const alt = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
    const az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi));
    return { altitude: alt * DEG, azimuth: (az * DEG + 180) % 360 };
  }

  function sunPosition(date, lat, lon) {
    const d = toDays(date);
    const lw = -lon * RAD;
    const c = sunCoords(d);
    const H = siderealTime(d, lw) - c.ra;
    return altAz(H, c.dec, lat);
  }

  // Sun times: iterative-free approximation (Astronomy Answers / SunCalc method)
  const J0 = 0.0009;
  function julianCycle(d, lw) { return Math.round(d - J0 - lw / (2 * Math.PI)); }
  function approxTransit(Ht, lw, n) { return J0 + (Ht + lw) / (2 * Math.PI) + n; }
  function solarTransitJ(ds, M, L) { return 2451545.0 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L); }
  function hourAngle(h, phi, d) {
    return Math.acos((Math.sin(h * RAD) - Math.sin(phi * RAD) * Math.sin(d)) / (Math.cos(phi * RAD) * Math.cos(d)));
  }

  function sunTimesForAngle(date, lat, lon, angle) {
    const lw = -lon * RAD;
    const d = toDays(date);
    const n = julianCycle(d, lw);
    const dsNoon = approxTransit(0, lw, n);
    const M = solarMeanAnomaly(dsNoon);
    const L = eclipticLongitude(M);
    const dec = Math.asin(Math.sin(obliquity(dsNoon)) * Math.sin(L));
    const Jnoon = solarTransitJ(dsNoon, M, L);
    let Jset = null, Jrise = null;
    const H = hourAngle(angle, lat, dec);
    if (!isNaN(H)) {
      const dsSet = approxTransit(H, lw, n);
      Jset = solarTransitJ(dsSet, M, L);
      const dsRise = dsNoon - (dsSet - dsNoon);
      Jrise = solarTransitJ(dsRise, M, L);
    }
    return {
      rise: Jrise ? fromJulian(Jrise) : null,
      set: Jset ? fromJulian(Jset) : null,
      transit: fromJulian(Jnoon)
    };
  }

  function sunTimes(date, lat, lon) {
    return {
      sunrise: sunTimesForAngle(date, lat, lon, -0.833),
      sunset: sunTimesForAngle(date, lat, lon, -0.833),
      civilDawn: sunTimesForAngle(date, lat, lon, -6),
      civilDusk: sunTimesForAngle(date, lat, lon, -6),
      nauticalDawn: sunTimesForAngle(date, lat, lon, -12),
      nauticalDusk: sunTimesForAngle(date, lat, lon, -12),
      astroDawn: sunTimesForAngle(date, lat, lon, -18),
      astroDusk: sunTimesForAngle(date, lat, lon, -18)
    };
  }

  // ---- Moon position (Meeus, ch 47, truncated series - good to a few arcmin) ----
  function moonCoords(d) {
    const L = RAD * (218.316 + 13.176396 * d);
    const M = RAD * (134.963 + 13.064993 * d);
    const F = RAD * (93.272 + 13.229350 * d);
    const l = L + RAD * 6.289 * Math.sin(M);
    const b = RAD * 5.128 * Math.sin(F);
    const dt = 385001 - 20905 * Math.cos(M);
    return { ra: rightAscension(l, b), dec: declination(l, b), dist: dt };
  }
  function rightAscension(l, b) {
    const e = RAD * 23.4393;
    return Math.atan2(Math.sin(l) * Math.cos(e) - Math.tan(b) * Math.sin(e), Math.cos(l));
  }
  function declination(l, b) {
    const e = RAD * 23.4393;
    return Math.asin(Math.sin(b) * Math.cos(e) + Math.cos(b) * Math.sin(e) * Math.sin(l));
  }

  function moonPosition(date, lat, lon) {
    const d = toDays(date);
    const lw = -lon * RAD;
    const c = moonCoords(d);
    const H = siderealTime(d, lw) - c.ra;
    let pos = altAz(H, c.dec, lat);
    // parallax correction (rough)
    const pa = Math.atan2(Math.cos(lat * RAD) * Math.sin(H), Math.tan(c.dec) * Math.cos(lat*RAD) - Math.sin(lat*RAD)*Math.cos(H));
    pos.altitude -= (6378.14 / c.dist) * Math.cos(pos.altitude * RAD) * DEG * 0; // negligible for our purposes, skip
    return pos;
  }

  function moonIllumination(date) {
    const d = toDays(date);
    const s = sunCoords(d);
    const m = moonCoords(d);
    const phi = Math.acos(
      Math.sin(s.dec) * Math.sin(m.dec) + Math.cos(s.dec) * Math.cos(m.dec) * Math.cos(s.ra - m.ra)
    );
    const inc = Math.atan2(Math.cos(s.dec) * Math.sin(s.ra - m.ra), Math.sin(s.dec) * Math.cos(m.dec) - Math.cos(s.dec) * Math.sin(m.dec) * Math.cos(s.ra - m.ra));
    const angle = Math.atan2(Math.cos(s.dec) * Math.sin(s.ra - m.ra), Math.sin(s.dec) * Math.cos(m.dec) - Math.cos(s.dec) * Math.sin(m.dec) * Math.cos(s.ra - m.ra));
    const phase = 0.5 + 0.5 * Math.sin(inc) * (Math.PI > 0 ? 1 : -1);
    // fraction illuminated
    const k = (1 + Math.cos(phi)) / 2;
    // phase 0..1 (0=new,0.5=full,1=new again), using standard formula
    let phaseFraction = 0.5 + 0.5 * (phi * (angle < 0 ? -1 : 1)) / Math.PI;
    phaseFraction = ((phaseFraction % 1) + 1) % 1;
    return { fraction: k, phase: phaseFraction, angle };
  }

  function moonPhaseName(phase) {
    if (phase < 0.02 || phase > 0.98) return "New Moon";
    if (phase < 0.24) return "Waxing Crescent";
    if (phase < 0.26) return "First Quarter";
    if (phase < 0.49) return "Waxing Gibbous";
    if (phase < 0.51) return "Full Moon";
    if (phase < 0.74) return "Waning Gibbous";
    if (phase < 0.76) return "Last Quarter";
    return "Waning Crescent";
  }

  function moonPhaseEmoji(phase) {
    if (phase < 0.02 || phase > 0.98) return "🌑";
    if (phase < 0.24) return "🌒";
    if (phase < 0.26) return "🌓";
    if (phase < 0.49) return "🌔";
    if (phase < 0.51) return "🌕";
    if (phase < 0.74) return "🌖";
    if (phase < 0.76) return "🌗";
    return "🌘";
  }

  // rough moon rise/set by sampling altitude across the day (robust, avoids edge-case singularities)
  function moonRiseSet(date, lat, lon) {
    const start = new Date(date); start.setHours(0,0,0,0);
    let prevAlt = moonPosition(new Date(start.getTime()), lat, lon).altitude;
    let rise = null, set = null;
    for (let m = 1; m <= 24*60; m += 5) {
      const t = new Date(start.getTime() + m*60000);
      const alt = moonPosition(t, lat, lon).altitude;
      if (prevAlt < 0 && alt >= 0 && !rise) rise = t;
      if (prevAlt >= 0 && alt < 0 && !set) set = t;
      prevAlt = alt;
    }
    return { rise, set };
  }

  // ---- Planets: approximate heliocentric Keplerian elements (J2000, linear rates) ----
  // Elements: a(AU), e, i(deg), L(deg mean longitude), varpi(deg long. of perihelion), Omega(deg long. asc. node)
  // Source form: standard low-precision planetary elements (Meeus/JPL simplified), rates per century (T).
  const PLANET_ELEMENTS = {
    Mercury: { a:[0.38709927,0.00000037], e:[0.20563593,0.00001906], i:[7.00497902,-0.00594749], L:[252.25032350,149472.67411175], lp:[77.45779628,0.16047689], node:[48.33076593,-0.12534081] },
    Venus:   { a:[0.72333566,0.00000390], e:[0.00677672,-0.00004107], i:[3.39467605,-0.00078890], L:[181.97909950,58517.81538729], lp:[131.60246718,0.00268329], node:[76.67984255,-0.27769418] },
    Mars:    { a:[1.52371034,0.00001847], e:[0.09339410,0.00007882], i:[1.84969142,-0.00813131], L:[-4.55343205,19140.30268499], lp:[-23.94362959,0.44441088], node:[49.55953891,-0.29257343] },
    Jupiter: { a:[5.20288700,-0.00011607], e:[0.04838624,-0.00013253], i:[1.30439695,-0.00183714], L:[34.39644051,3034.74612775], lp:[14.72847983,0.21252668], node:[100.47390909,0.20469106] },
    Saturn:  { a:[9.53667594,-0.00125060], e:[0.05386179,-0.00050991], i:[2.48599187,0.00193609], L:[49.95424423,1222.49362201], lp:[92.59887831,-0.41897216], node:[113.66242448,-0.28867794] },
    Uranus:  { a:[19.18916464,-0.00196176], e:[0.04725744,-0.00004397], i:[0.77263783,-0.00242939], L:[313.23810451,428.48202785], lp:[170.95427630,0.40805281], node:[74.01692503,0.04240589] },
    Neptune: { a:[30.06992276,0.00026291], e:[0.00859048,0.00005105], i:[1.77004347,0.00035372], L:[-55.12002969,218.45945325], lp:[44.96476227,-0.32241464], node:[131.78422574,-0.00508664] }
  };
  const PLANET_MAG = { // approximate visual magnitude base (varies with distance/phase, simplified constant-ish estimate handled below)
    Mercury: -0.6, Venus: -4.4, Mars: -1.5, Jupiter: -2.5, Saturn: 0.4, Uranus: 5.7, Neptune: 7.8
  };

  function keplerSolve(M, e) {
    let E = M;
    for (let i = 0; i < 10; i++) {
      E = E - (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
    }
    return E;
  }

  function planetHeliocentric(name, T) {
    const el = PLANET_ELEMENTS[name];
    const a = el.a[0] + el.a[1]*T;
    const e = el.e[0] + el.e[1]*T;
    const i = (el.i[0] + el.i[1]*T) * RAD;
    const L = (el.L[0] + el.L[1]*T) * RAD;
    const lp = (el.lp[0] + el.lp[1]*T) * RAD;
    const node = (el.node[0] + el.node[1]*T) * RAD;
    const M = L - lp;
    const w = lp - node;
    const Mn = ((M % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
    const E = keplerSolve(Mn, e);
    const xv = a * (Math.cos(E) - e);
    const yv = a * Math.sqrt(1 - e*e) * Math.sin(E);
    const v = Math.atan2(yv, xv);
    const r = Math.sqrt(xv*xv + yv*yv);
    const xh = r * (Math.cos(node)*Math.cos(v+w) - Math.sin(node)*Math.sin(v+w)*Math.cos(i));
    const yh = r * (Math.sin(node)*Math.cos(v+w) + Math.cos(node)*Math.sin(v+w)*Math.cos(i));
    const zh = r * (Math.sin(v+w)*Math.sin(i));
    return { x: xh, y: yh, z: zh, r };
  }

  function earthHeliocentric(T) {
    // Earth elements
    const a = 1.00000261 + (0.00000562)*T;
    const e = 0.01671123 + (-0.00004392)*T;
    const i = (0.0 + (-0.01294668)*T) * RAD;
    const L = (100.46457166 + 35999.37244981*T) * RAD;
    const lp = (102.93768193 + 0.32327364*T) * RAD;
    const node = 0;
    const M = L - lp;
    const w = lp - node;
    const Mn = ((M % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
    const E = keplerSolve(Mn, e);
    const xv = a * (Math.cos(E) - e);
    const yv = a * Math.sqrt(1 - e*e) * Math.sin(E);
    const v = Math.atan2(yv, xv);
    const r = Math.sqrt(xv*xv + yv*yv);
    const xh = r * Math.cos(v+w);
    const yh = r * Math.sin(v+w);
    return { x: xh, y: yh, z: 0, r };
  }

  function planetGeocentric(name, date) {
    const d = toDays(date);
    const T = d / 36525;
    const p = planetHeliocentric(name, T);
    const earth = earthHeliocentric(T);
    const xg = p.x - earth.x;
    const yg = p.y - earth.y;
    const zg = p.z - earth.z;
    const e_obl = 23.4393 * RAD;
    const xeq = xg;
    const yeq = yg * Math.cos(e_obl) - zg * Math.sin(e_obl);
    const zeq = yg * Math.sin(e_obl) + zg * Math.cos(e_obl);
    const dist = Math.sqrt(xeq*xeq + yeq*yeq + zeq*zeq);
    const ra = Math.atan2(yeq, xeq);
    const dec = Math.asin(zeq / dist);
    return { ra, dec, dist, sunDist: Math.sqrt(p.x*p.x+p.y*p.y+p.z*p.z), earthSunDist: earth.r };
  }

  function planetAltAz(name, date, lat, lon) {
    const d = toDays(date);
    const lw = -lon * RAD;
    const g = planetGeocentric(name, date);
    const H = siderealTime(d, lw) - g.ra;
    const pos = altAz(H, g.dec, lat);
    return { ...pos, dist: g.dist, sunDist: g.sunDist, earthSunDist: g.earthSunDist };
  }

  function planetMagnitude(name, geo) {
    // very rough phase-corrected magnitude estimate
    const base = PLANET_MAG[name] || 5;
    const distFactor = 5 * Math.log10(geo.dist * geo.sunDist);
    return +(base + distFactor - 5*Math.log10(1)).toFixed(1); // simplified; good enough for relative ranking
  }

  return {
    sunPosition, sunTimes, moonPosition, moonIllumination, moonPhaseName, moonPhaseEmoji,
    moonRiseSet, planetAltAz, planetMagnitude, toDays, RAD, DEG
  };
})();

      privacy: { storePreciseCoords: false, shareWithServices: true },
      xp: 0,
      streak: { count: 0, lastDate: null },
      discovered: [], // array of catalogue ids
      achievements: [], // array of achievement ids
      gallery: [], // {id, dataUrl, date, object, mission, xp, quality, equipment, location}
      activeMission: null,
      cachedSky: null, // last known sky data for offline
      cachedSkyTime: null,
      lastLocation: null // {lat, lon, label}
    };
  }
  function getState() {
    const saved = loadState();
    if(!saved) return defaultState();
    // Migration safety net: any field added to defaultState() after a user's
    // state was already saved to localStorage won't exist on their saved
    // object. A shallow merge fixes top-level missing fields (like the
    // 'timers' array added later); nested objects that existed before but
    // gained new sub-fields (e.g. 'equipment', 'privacy') are merged one
    // level deeper too, so we don't silently drop the user's saved values
    // inside those objects while still filling in anything new.
    const defaults = defaultState();
    const merged = { ...defaults, ...saved };
    for(const key of Object.keys(defaults)){
      if(defaults[key] && typeof defaults[key] === 'object' && !Array.isArray(defaults[key]) &&
         saved[key] && typeof saved[key] === 'object' && !Array.isArray(saved[key])){
        merged[key] = { ...defaults[key], ...saved[key] };
      }
    }
    return merged;
  }

  return {
    LEVELS, levelForXP, PLANETS_CATALOGUE, DEEPSKY_CATALOGUE, CONSTELLATIONS, TOTAL_CATALOGUE_SIZE,
    ACHIEVEMENTS, PHONE_MISSIONS, TELESCOPE_MISSIONS, FALLBACK_ACTIVITIES, QUIZ_QUESTIONS,
    getState, saveState, defaultState
  };
})();

</script>
<script>
// AstroSnap Planet Images — real NASA/spacecraft photos instead of generic emoji.
//
// Uses the official Wikimedia REST API (api.wikimedia.org/core/v1/commons/file/...)
// to look up the CURRENT, correct image URL for each body at runtime, rather than
// hardcoding a guessed upload.wikimedia.org path (those paths are content-hashed
// and guessing them wrong silently breaks the image). Results are cached in
// localStorage so we don't re-fetch on every render, and every image has a
// same-planet emoji fallback if the network request fails or the device is
// offline — never a broken image icon.
const PlanetImages = (() => {

  // Wikimedia Commons filenames — real spacecraft photography for each body.
  const FILES = {
    Mercury: 'Mercury in true color.jpg',        // MESSENGER, 2008
    Venus:   'Venus-real color.jpg',               // Mariner 10
    Mars:    'Mars Valles Marineris.jpeg',          // Viking orbiter mosaic
    Jupiter: 'Jupiter and its shrunken Great Red Spot.jpg', // Hubble
    Saturn:  'Saturn during Equinox.jpg',           // Cassini
    Uranus:  'Uranus2.jpg',                          // Voyager 2
    Neptune: 'Neptune Full.jpg',                     // Voyager 2
    Moon:    'FullMoon2010.jpg'                      // well-known full disc lunar photo
  };

  const CACHE_KEY = 'astrosnap_planet_image_cache_v1';
  const CACHE_TTL_MS = 30 * 24 * 60 * 60 * 1000; // 30 days — these images never change

  function loadCache() {
    try { return JSON.parse(localStorage.getItem(CACHE_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function saveCache(cache) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch (e) { /* storage full — non-fatal, just skip caching */ }
  }

  const memoryCache = {}; // avoids hitting localStorage repeatedly within one session
  const inFlight = {};    // dedupes concurrent fetches for the same body

  async function getImageUrl(bodyName) {
    if (memoryCache[bodyName]) return memoryCache[bodyName];

    const cache = loadCache();
    const cached = cache[bodyName];
    if (cached && (Date.now() - cached.fetchedAt) < CACHE_TTL_MS) {
      memoryCache[bodyName] = cached.url;
      return cached.url;
    }

    if (inFlight[bodyName]) return inFlight[bodyName];

    const filename = FILES[bodyName];
    if (!filename) return null;

    inFlight[bodyName] = (async () => {
      try {
        const resp = await fetch('https://api.wikimedia.org/core/v1/commons/file/' + encodeURIComponent('File:' + filename), {
          headers: { 'Api-User-Agent': 'AstroSnap/1.0 (astrophotography companion app)' }
        });
        if (!resp.ok) throw new Error('Wikimedia API ' + resp.status);
        const data = await resp.json();
        // Prefer a mid-size thumbnail (fast to load, still crisp on a small icon)
        // rather than the full-resolution original.
        const url = (data.thumbnail && data.thumbnail.url) || (data.preferred && data.preferred.url) || data.original.url;
        memoryCache[bodyName] = url;
        const freshCache = loadCache();
        freshCache[bodyName] = { url, fetchedAt: Date.now() };
        saveCache(freshCache);
        return url;
      } catch (e) {
        return null; // caller falls back to emoji
      } finally {
        delete inFlight[bodyName];
      }
    })();

    return inFlight[bodyName];
  }

  // Emoji fallback, reused from the existing planetEmoji mapping style.
  const EMOJI_FALLBACK = { Mercury:'☿️', Venus:'♀️', Mars:'🔴', Jupiter:'🪐', Saturn:'🪐', Uranus:'🔵', Neptune:'🔷', Moon:'🌕' };

  // Renders an <img> that starts as the emoji fallback (so layout never jumps
  // or shows a broken-image icon) and swaps to the real photo once loaded.
  // Returns an HTML string; call attachImageSwaps() after inserting into the
  // DOM so the async image loads can find their placeholder elements.
  let swapCounter = 0;
  const pendingSwaps = [];

  function iconHtml(bodyName, sizePx) {
    sizePx = sizePx || 26;
    const swapId = 'planetimg_' + (swapCounter++);
    const fallback = EMOJI_FALLBACK[bodyName] || '🪐';
    pendingSwaps.push({ swapId, bodyName });
    return `<span id="${swapId}" style="display:inline-flex;align-items:center;justify-content:center;width:${sizePx}px;height:${sizePx}px;font-size:${Math.round(sizePx*0.8)}px;overflow:hidden;border-radius:50%;">${fallback}</span>`;
  }

  // Call this once after rendering HTML that contains iconHtml() placeholders.
  // Swaps each placeholder's content for a real <img> once the URL resolves;
  // silently leaves the emoji in place if the fetch fails.
  function attachImageSwaps() {
    const batch = pendingSwaps.splice(0, pendingSwaps.length);
    batch.forEach(({ swapId, bodyName }) => {
      getImageUrl(bodyName).then(url => {
        if (!url) return;
        const el = document.getElementById(swapId);
        if (!el) return; // screen was re-rendered before the fetch resolved — fine, just skip
        const img = new Image();
        img.onload = () => {
          el.style.fontSize = '0';
          el.innerHTML = '';
          img.style.width = '100%';
          img.style.height = '100%';
          img.style.objectFit = 'cover';
          el.appendChild(img);
        };
        img.onerror = () => { /* keep emoji fallback */ };
        img.src = url;
      });
    });
  }

  return { iconHtml, attachImageSwaps, getImageUrl };
})();

window.PlanetImages = PlanetImages;

</script>
<script>
// AstroSnap Application Logic
(function(){
"use strict";

let STATE = AppData.getState();
let SKY = null; // computed sky data cache for this session
let currentScreen = null;

function persist(){ AppData.saveState(STATE); }

// ================= Toasts =================
function toast(msg, kind){
  const host = document.getElementById('toast-host');
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.borderLeft = '3px solid ' + (kind==='error' ? 'var(--red)' : kind==='success' ? 'var(--green)' : 'var(--blue)');
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3200);
}

// ================= Starfield canvas (signature element) =================
function initStarfield(){
  const canvas = document.getElementById('skyCanvas');
  const ctx = canvas.getContext('2d');
  let stars = [];
  function resize(){
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth+'px';
    canvas.style.height = window.innerHeight+'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    const count = Math.floor((window.innerWidth * window.innerHeight) / 3200);
    stars = Array.from({length:count}, ()=>({
      x: Math.random()*window.innerWidth,
      y: Math.random()*window.innerHeight,
      r: Math.random()*1.3 + 0.2,
      baseAlpha: Math.random()*0.5 + 0.25,
      tw: Math.random()*Math.PI*2,
      speed: Math.random()*0.015 + 0.005
    }));
  }
  function frame(t){
    ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    for(const s of stars){
      s.tw += s.speed;
      const a = s.baseAlpha + Math.sin(s.tw)*0.2;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(230,235,255,${Math.max(0,a)})`;
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
}

// ================= Navigation =================
const SCREENS = ['onboard-equip','onboard-location','home','sky','missions','gallery','profile','capture'];
function showScreen(name, opts){
  opts = opts || {};
  SCREENS.forEach(s=>{
    document.getElementById('screen-'+s).classList.toggle('active', s===name);
  });
  currentScreen = name;
  document.getElementById('bottomnav').style.display =
    ['home','sky','missions','gallery','profile'].includes(name) ? 'flex' : 'none';
  document.querySelectorAll('.navitem').forEach(el=>{
    el.classList.toggle('active', el.dataset.nav === name);
  });
  window.scrollTo(0,0);
  render(name, opts);
}
document.addEventListener('click', (e)=>{
  const nav = e.target.closest('.navitem');
  if(nav){ showScreen(nav.dataset.nav); }
});

// ================= Modal helper =================
function openModal(innerHtml, onMount){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><div class="modal-sheet"><div class="sheet-handle"></div>${innerHtml}</div></div>`;
  document.getElementById('modalBackdrop').addEventListener('click', (e)=>{
    if(e.target.id==='modalBackdrop') closeModal();
  });
  if(onMount) onMount(root);
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

// ================= Render dispatcher =================
function render(name, opts){
  window.__ASTRO__.__currentScreenName = name;
  if(name==='onboard-equip') renderOnboardEquip();
  else if(name==='onboard-location') renderOnboardLocation();
  else if(name==='home') window.__astroScreens.renderHome();
  else if(name==='sky') window.__astroScreens.renderSky();
  else if(name==='missions') window.__astroScreens2.renderMissions();
  else if(name==='gallery') window.__astroScreens2.renderGallery();
  else if(name==='profile') window.__astroScreens2.renderProfile();
  else if(name==='capture') window.__astroScreens2.renderCapture(opts);
}

// ================= ONBOARDING: Equipment =================
function renderOnboardEquip(){
  const el = document.getElementById('screen-onboard-equip');
  el.innerHTML = `
  <div class="onboard-wrap">
    <div class="progress-dots"><span class="done"></span><span></span><span></span></div>
    <div style="text-align:center;margin-bottom:28px;">
      <div class="eyebrow" style="justify-content:center;">Step 1 of 2</div>
      <h1 class="h1">What are you using for astrophotography?</h1>
    </div>
    <div class="equip-card" id="pick-phone">
      <span class="equip-icon">📱</span>
      <div class="equip-title">Phone</div>
      <div class="equip-quote">"I use my smartphone for astrophotography."</div>
    </div>
    <div class="equip-card" id="pick-telescope">
      <span class="equip-icon">🔭</span>
      <div class="equip-title">Telescope</div>
      <div class="equip-quote">"I use a telescope for astrophotography."</div>
    </div>
    <button class="btn btn-primary" id="equipContinue" disabled style="margin-top:8px;">Continue</button>
  </div>`;
  let picked = null;
  function pick(type){
    picked = type;
    document.getElementById('pick-phone').classList.toggle('selected', type==='phone');
    document.getElementById('pick-telescope').classList.toggle('selected', type==='telescope');
    document.getElementById('equipContinue').disabled = false;
  }
  document.getElementById('pick-phone').onclick = ()=>pick('phone');
  document.getElementById('pick-telescope').onclick = ()=>pick('telescope');
  document.getElementById('equipContinue').onclick = ()=>{
    STATE.equipment.type = picked;
    persist();
    showScreen('onboard-location');
