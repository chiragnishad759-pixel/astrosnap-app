}

// ================= ONBOARDING: Location =================
function renderOnboardLocation(){
  const el = document.getElementById('screen-onboard-location');
  el.innerHTML = `
  <div class="onboard-wrap">
    <div class="progress-dots"><span class="done"></span><span class="done"></span><span></span></div>
    <div style="text-align:center;margin-bottom:8px;">
      <div style="font-size:52px;margin-bottom:14px;">🌍</div>
      <h1 class="h1">AstroSnap needs your location</h1>
    </div>
    <p class="muted" style="text-align:center;margin:14px 0 26px 0;">
      Your location helps AstroSnap calculate your local sky conditions, cloud coverage, visible astronomical objects, darkness, and astrophotography opportunities.
    </p>
    <div class="card" style="margin-bottom:22px;">
      <div class="row-between" style="margin-bottom:10px;">
        <span class="muted">📍 Precision</span>
        <span class="data" style="font-size:13px;color:var(--text-hi);">Approximate preferred</span>
      </div>
      <div class="row-between">
        <span class="muted">🔐 Storage</span>
        <span class="data" style="font-size:13px;color:var(--text-hi);">On-device only</span>
      </div>
    </div>
    <button class="btn btn-primary" id="allowLoc">Allow Location</button>
    <button class="btn btn-ghost" id="notNowLoc" style="margin-top:10px;">Not Now</button>
  </div>`;
  document.getElementById('allowLoc').onclick = requestLocation;
  document.getElementById('notNowLoc').onclick = ()=>{
    STATE.locationPermission = 'denied';
    STATE.onboarded = true;
    persist();
    toast('You can enable location anytime from Profile → Privacy', 'info');
    showScreen('home');
  };
}

function requestLocation(){
  if(!navigator.geolocation){
    toast('Geolocation is not supported on this device/browser.', 'error');
    STATE.locationPermission = 'denied';
    STATE.onboarded = true;
    persist();
    showScreen('home');
    return;
  }
  const btn = document.getElementById('allowLoc');
  if(btn){ btn.textContent = 'Requesting…'; btn.disabled = true; }
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      STATE.locationPermission = 'granted';
      STATE.lastLocation = {
        lat: STATE.privacy.storePreciseCoords ? pos.coords.latitude : roundCoord(pos.coords.latitude),
        lon: STATE.privacy.storePreciseCoords ? pos.coords.longitude : roundCoord(pos.coords.longitude),
        label: null
      };
      STATE.onboarded = true;
      persist();
      reverseGeocode(STATE.lastLocation.lat, STATE.lastLocation.lon);
      showScreen('home');
      fetchSkyData(STATE.lastLocation.lat, STATE.lastLocation.lon);
    },
    (err)=>{
      STATE.locationPermission = 'denied';
      STATE.onboarded = true;
      persist();
      let msg = 'Location permission denied.';
      if(err.code === err.TIMEOUT) msg = 'Location request timed out.';
      if(err.code === err.POSITION_UNAVAILABLE) msg = 'Location unavailable on this device.';
      toast(msg + ' Showing limited sky info.', 'error');
      showScreen('home');
    },
    { enableHighAccuracy:false, timeout:10000, maximumAge:600000 }
  );
}
// Round to ~1.1km precision — "prefer approximate location" per privacy principles
function roundCoord(v){ return Math.round(v*100)/100; }

function reverseGeocode(lat, lon){
  fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=10`, {headers:{}})
    .then(r=>r.ok?r.json():null)
    .then(data=>{
      if(!data) return;
      const a = data.address || {};
      const label = a.city || a.town || a.village || a.county || a.state || data.name || 'Your location';
      STATE.lastLocation.label = label;
      persist();
      if(currentScreen==='home') renderHome();
    })
    .catch(()=>{ /* silent fail, label stays null -> we show coords */ });
}

// ================= NOTIFICATIONS =================
// Real browser Notification API. Honest limits, stated plainly:
// - Only works while this tab is open (foreground or backgrounded) — not after the
//   tab or browser is fully closed, and not while the phone is locked, since that
//   would require a service worker + push server, which this single-page app doesn't have.
// - Requires HTTPS (or localhost). Opened directly as a file:// page, permission
//   cannot be requested at all — we detect that and say so rather than fail silently.
function notificationsSupported(){
  return 'Notification' in window && (location.protocol === 'https:' || location.hostname === 'localhost');
}

function requestNotificationPermission(){
  if(!('Notification' in window)){
    STATE.notificationPermission = 'unsupported';
    persist();
    toast('Notifications are not supported in this browser.', 'error');
    return Promise.resolve('unsupported');
  }
  if(location.protocol !== 'https:' && location.hostname !== 'localhost'){
    STATE.notificationPermission = 'unsupported';
    persist();
    toast('Notifications need this page to be served over HTTPS. Host it online (or run on localhost) to enable them.', 'error');
    return Promise.resolve('unsupported');
  }
  return Notification.requestPermission().then(perm=>{
    STATE.notificationPermission = perm; // 'granted' | 'denied' | 'default'
    STATE.notificationsEnabled = (perm === 'granted');
    persist();
    if(perm === 'granted'){
      toast('Notifications enabled — you\'ll get alerts while AstroSnap is open.', 'success');
      sendNotification('AstroSnap', { body: 'Notifications are on. We\'ll alert you here while the app is open.', silent:true });
    } else if(perm === 'denied'){
      toast('Notifications blocked. You can re-enable them from your browser\'s site settings.', 'error');
    }
    if(currentScreen==='profile') render('profile');
    return perm;
  });
}

// Sends a real OS-level notification if permission is granted and the tab is
// backgrounded; if the tab is focused, browsers usually still show it, but we
// also always toast in-app so the person never misses the alert either way.
function sendNotification(title, options){
  options = options || {};
  if(STATE.notificationsEnabled && notificationsSupported() && Notification.permission === 'granted'){
    // On many Android/Chrome setups, once a page has an active service
    // worker registration, the page-context `new Notification()` constructor
    // is disallowed or silently swallowed — the spec pushes notification
    // display through the service worker's registration instead. We try
    // that path first when a registration exists, and fall back to the
    // plain constructor for browsers/desktops where that isn't required.
    navigator.serviceWorker && navigator.serviceWorker.getRegistration
      ? navigator.serviceWorker.getRegistration().then(reg=>{
          if(reg && reg.showNotification){
            reg.showNotification(title, { icon: undefined, badge: undefined, ...options })
              .catch(()=>tryPlainNotification(title, options));
          } else {
            tryPlainNotification(title, options);
          }
        }).catch(()=>tryPlainNotification(title, options))
      : tryPlainNotification(title, options);
  }
  if(!options.silent){
    toast(`${title}${options.body ? ' — ' + options.body : ''}`, 'info');
  }
}

function tryPlainNotification(title, options){
  try{
    const n = new Notification(title, { icon: undefined, badge: undefined, ...options });
    if(!options.silent){
      n.onclick = ()=>{ window.focus(); n.close(); };
    }
  }catch(e){
    console.error('Notification failed', e);
  }
}

// Dedupe helper so we don't spam the same alert every time sky data refreshes.
// Each event key can only fire once per cooldown window (default 2 hours).
function notifyOnce(key, title, body, cooldownMs){
  cooldownMs = cooldownMs || 2*60*60*1000;
  const last = STATE.notifiedEvents[key];
  const now = Date.now();
  if(last && (now - last) < cooldownMs) return false;
  STATE.notifiedEvents[key] = now;
  persist();
  sendNotification(title, { body });
  return true;
}

// expose for later modules
window.__ASTRO__ = {
  get STATE(){ return STATE; },
  set STATE(v){ STATE = v; },
  get SKY(){ return SKY; },
  set SKY(v){ SKY = v; },
  persist, toast, showScreen, openModal, closeModal, roundCoord, requestLocation, reverseGeocode,
  requestNotificationPermission, sendNotification, notifyOnce, notificationsSupported,
  parseOpenMeteoLocalTime
};

// ================= Boot =================
document.addEventListener('DOMContentLoaded', ()=>{
  initStarfield();
  if(!STATE.onboarded){
    showScreen('onboard-equip');
  } else {
    showScreen('home');
    if(STATE.locationPermission === 'granted' && STATE.lastLocation){
      if(navigator.onLine){
        fetchSkyData(STATE.lastLocation.lat, STATE.lastLocation.lon);
      } else if(STATE.cachedSky){
        SKY = STATE.cachedSky; SKY.stale = true; SKY.staleSince = STATE.cachedSkyTime;
        render(currentScreen);
      }
    }
  }
  registerStreak();

  window.addEventListener('online', ()=>{
    toast('Back online — refreshing sky data…', 'info');
    if(STATE.locationPermission==='granted' && STATE.lastLocation){
      fetchSkyData(STATE.lastLocation.lat, STATE.lastLocation.lon);
    }
  });
  window.addEventListener('offline', ()=>{
    toast('You are offline. Showing cached data where available.', 'error');
  });

  // Periodic refresh every 10 minutes while app is open and online
  setInterval(()=>{
    if(navigator.onLine && STATE.locationPermission==='granted' && STATE.lastLocation){
      fetchSkyData(STATE.lastLocation.lat, STATE.lastLocation.lon);
    }
  }, 10*60*1000);
});

function registerStreak(){
  const today = new Date().toDateString();
  if(STATE.streak.lastDate === today) return;
  const yesterday = new Date(Date.now()-86400000).toDateString();
  if(STATE.streak.lastDate === yesterday){
    STATE.streak.count += 1;
  } else if(STATE.streak.lastDate !== null){
    STATE.streak.count = 1;
  } else {
    STATE.streak.count = 1;
  }
  STATE.streak.lastDate = today;
  persist();
  if(STATE.streak.count === 7) unlockAchievement('streak_7');
}

window.__registerStreak = registerStreak;

// ================================================================
// SKY DATA ENGINE — real weather (Open-Meteo, no key required) +
// real astronomy math (AstroMath engine) combined into a single
// "sky snapshot" used across Home / Sky / Missions.
// ================================================================
let skyFetchInFlight = false;

async function fetchSkyData(lat, lon){
  if(skyFetchInFlight) return SKY;
  skyFetchInFlight = true;
  const previousSky = SKY; // keep reference before overwrite, to detect real changes
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
      `&current=cloud_cover,temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m,` +
      `precipitation,visibility,surface_pressure,dew_point_2m` +
      `&hourly=cloudcover,temperature_2m,relativehumidity_2m,windspeed_10m,winddirection_10m,` +
      `visibility,surface_pressure,precipitation_probability,dewpoint_2m` +
      `&daily=sunrise,sunset&timezone=auto&forecast_days=2`;
    const controller = new AbortController();
    const timeoutId = setTimeout(()=>controller.abort(), 12000);
    const resp = await fetch(url, { signal: controller.signal });
    clearTimeout(timeoutId);
    if(!resp.ok) throw new Error('Weather API error ' + resp.status);
    const wx = await resp.json();
    const snapshot = buildSkySnapshot(lat, lon, wx);
    SKY = snapshot;
    STATE.cachedSky = snapshot;
    STATE.cachedSkyTime = Date.now();
    persist();
    checkNotifyworthyChanges(previousSky, snapshot);
    if(['home','sky','missions'].includes(currentScreen)) render(currentScreen);
    return snapshot;
  }catch(err){
    console.error(err);
    toast('Weather service unavailable — showing last cached data if available.', 'error');
    if(STATE.cachedSky){
      SKY = STATE.cachedSky;
      SKY.stale = true;
      SKY.staleSince = STATE.cachedSkyTime;
    } else {
      SKY = null;
    }
    if(['home','sky','missions'].includes(currentScreen)) render(currentScreen);
    return SKY;
  } finally {
    skyFetchInFlight = false;
  }
}

// Open-Meteo, with timezone=auto, returns hourly timestamps as local wall-clock
// time strings with NO timezone offset (e.g. "2026-08-19T21:00" meaning
// "9pm at the requested location", not UTC and not the browser's timezone).
// `new Date("2026-08-19T21:00")` is ambiguous across JS engines — some treat
// the missing-offset form as UTC, which silently shifts every lookup by the
// difference between UTC and the location's real offset (5.5 hours for
// India, for example) and picks the wrong hour's cloud data entirely.
// We parse the components manually and build a Date in the *browser's own*
// local timezone instead — correct as long as the browser's timezone matches
// the location being queried, which holds for our use case (asking about
// "my current sky" from "my current location").
function parseOpenMeteoLocalTime(timeStr){
  const [datePart, timePart] = timeStr.split('T');
  const [year, month, day] = datePart.split('-').map(Number);
  const [hour, minute] = timePart.split(':').map(Number);
  return new Date(year, month - 1, day, hour, minute);
}

function findHourlyIndex(hourlyTimes){
  const now = new Date();
  let best = 0, bestDiff = Infinity;
  hourlyTimes.forEach((t,i)=>{
    const diff = Math.abs(parseOpenMeteoLocalTime(t).getTime() - now.getTime());
    if(diff < bestDiff){ bestDiff = diff; best = i; }
  });
  return best;
}

// NOTE: Bortle (light pollution) class was previously estimated with a hardcoded
// placeholder. There is no free, no-key, browser-callable API that returns a real
// Bortle value for a given lat/lon — the actual data (VIIRS satellite imagery) is
// only distributed as large raster files meant for GIS software, not a simple API.
// Rather than show a fake number, AstroSnap does not display or use Bortle class at all.

function buildSkySnapshot(lat, lon, wx){
  const now = new Date();
  const idx = findHourlyIndex(wx.hourly.time);
  // Prefer the `current` block — Open-Meteo's actual latest observation/
  // nowcast for this instant — over picking the "nearest hour" out of the
  // hourly forecast array. The hourly series is a forecast timeline (useful
  // for the cloud trend chart), and can genuinely diverge from the current
  // observed value by a meaningful margin; conflating "nearest forecast
  // hour" with "right now" was reported as inaccurate cloud % readings.
  const cur = wx.current || {};
  const cloud = cur.cloud_cover != null ? cur.cloud_cover : wx.hourly.cloudcover[idx];
  const temp = cur.temperature_2m != null ? cur.temperature_2m : wx.hourly.temperature_2m[idx];
  const humidity = cur.relative_humidity_2m != null ? cur.relative_humidity_2m : wx.hourly.relativehumidity_2m[idx];
  const wind = cur.wind_speed_10m != null ? cur.wind_speed_10m : wx.hourly.windspeed_10m[idx];
  const windDir = cur.wind_direction_10m != null ? cur.wind_direction_10m : wx.hourly.winddirection_10m[idx];
  const visibility = cur.visibility != null ? cur.visibility : (wx.hourly.visibility ? wx.hourly.visibility[idx] : null);
  const pressure = cur.surface_pressure != null ? cur.surface_pressure : (wx.hourly.surface_pressure ? wx.hourly.surface_pressure[idx] : null);
  const precipProb = wx.hourly.precipitation_probability ? wx.hourly.precipitation_probability[idx] : null; // current has no probability field
  const dewpoint = cur.dew_point_2m != null ? cur.dew_point_2m : (wx.hourly.dewpoint_2m ? wx.hourly.dewpoint_2m[idx] : null);
  const fogRisk = (dewpoint!=null && temp!=null) ? Math.max(0, 100 - Math.abs(temp-dewpoint)*20) : null;

  // Sun/Moon/twilight via real astronomy math
  const sunTimes = AstroMath.sunTimes(now, lat, lon);
  const sunPos = AstroMath.sunPosition(now, lat, lon);
  const moonPos = AstroMath.moonPosition(now, lat, lon);
  const moonIllum = AstroMath.moonIllumination(now);
  const moonRS = AstroMath.moonRiseSet(now, lat, lon);

  // Darkness state right now
  let darknessState = 'daylight';
  if(sunPos.altitude < -18) darknessState = 'astronomical';
  else if(sunPos.altitude < -12) darknessState = 'nautical';
  else if(sunPos.altitude < -6) darknessState = 'civil';
  else if(sunPos.altitude < -0.833) darknessState = 'twilight';

  // Planets
  const planets = AppData.PLANETS_CATALOGUE.map(name=>{
    const pos = AstroMath.planetAltAz(name, now, lat, lon);
    const mag = AstroMath.planetMagnitude(name, pos);
    return { name, altitude: pos.altitude, azimuth: pos.azimuth, magnitude: mag, distanceAU: pos.dist, visible: pos.altitude > 0 };
  });

  // Deep sky objects: compute alt/az via RA/Dec using sidereal time
  const deepsky = AppData.DEEPSKY_CATALOGUE.map(obj=>{
    const d = AstroMath.toDays(now);
    const lw = -lon * AstroMath.RAD;
    const H = (AstroMath.RAD*(280.16 + 360.9856235*d) - lw) - (obj.ra*AstroMath.RAD);
    const phi = lat*AstroMath.RAD, dec = obj.dec*AstroMath.RAD;
    const alt = Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(H))*AstroMath.DEG;
    const az = (Math.atan2(Math.sin(H), Math.cos(H)*Math.sin(phi)-Math.tan(dec)*Math.cos(phi))*AstroMath.DEG+180)%360;
    return { ...obj, altitude: alt, azimuth: az, visible: alt > 0 };
  });

  // ---- Astro Score: transparent composite, not a black box ----
  // Weighted: clouds (40%), darkness/moon interference (25%), humidity/fog (15%), wind/seeing proxy (10%), precip (10%)
  const cloudScore = Math.max(0, 100 - cloud);
  const moonScore = Math.max(0, 100 - moonIllum.fraction*100*0.7); // full moon hurts less than clouds but still matters
  const humidityScore = Math.max(0, 100 - Math.max(0, humidity-50)*1.5);
  const windScore = wind==null ? 70 : Math.max(0, 100 - wind*2.2);
  const precipScore = precipProb==null ? 90 : Math.max(0, 100 - precipProb*1.3);
  const darknessBonus = darknessState==='astronomical' ? 100 : darknessState==='nautical' ? 60 : darknessState==='civil' ? 25 : darknessState==='twilight' ? 10 : 0;

  let astroScore = Math.round(
    cloudScore*0.38 + darknessBonus*0.22 + moonScore*0.16 + humidityScore*0.10 + windScore*0.08 + precipScore*0.06
  );
  astroScore = Math.max(0, Math.min(100, astroScore));

  return {
    fetchedAt: now.getTime(),
    lat, lon,
    weather: { cloud, temp, humidity, wind, windDir, visibility, pressure, precipProb, dewpoint, fogRisk },
    sun: { position: sunPos, times: sunTimes, darknessState },
    moon: { position: moonPos, illumination: moonIllum, phaseName: AstroMath.moonPhaseName(moonIllum.phase), phaseEmoji: AstroMath.moonPhaseEmoji(moonIllum.phase), riseSet: moonRS },
    planets,
    deepsky,
    astroScore,
    hourly: buildHourlyCloudTimeline(wx, lat, lon),
    stale: false
  };
}

// ---- Notification triggers: only real, verifiable changes, never invented urgency ----
function checkNotifyworthyChanges(prevSky, newSky){
  if(!STATE.notificationsEnabled) return;

  // 1) Astro Score crossed into "good" territory (60+) when it wasn't before
  if(newSky.astroScore >= 70 && (!prevSky || prevSky.astroScore < 70)){
    notifyOnce('score_good', '🌌 Great sky conditions now',
      `Astro Score is ${newSky.astroScore}/100 at your location.`);
  }

  // 2) We've now entered astronomical darkness (a real, useful moment for imaging)
  if(newSky.sun.darknessState === 'astronomical' && (!prevSky || prevSky.sun.darknessState !== 'astronomical')){
    notifyOnce('darkness_started', '🌃 Astronomical darkness has begun',
      `Clouds are at ${Math.round(newSky.weather.cloud)}%. Good time to check your mission.`);
  }

  // 3) The best low-cloud window (from the hourly forecast) is starting within the next ~30 min
  const bestHour = newSky.hourly.slice[newSky.hourly.bestIndex];
  if(bestHour){
    const bestTime = new Date(bestHour.time).getTime();
    const now = Date.now();
    const minutesAway = (bestTime - now) / 60000;
    if(minutesAway >= 0 && minutesAway <= 30 && bestHour.cloud <= 25){
      notifyOnce('best_window_' + bestHour.time, '⭐ Best imaging window starting soon',
        `Clouds expected around ${Math.round(bestHour.cloud)}% near ${new Date(bestHour.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}.`,
        3*60*60*1000);
    }
  }

  // 4) A mission that was unavailable is now available (conditions improved) — spec item 11
  if(window.__astroScreens2 && STATE.equipment.type){
    try{
      const missions = window.__astroScreens2.generateMissionList
        ? window.__astroScreens2.generateMissionList(STATE, newSky)
        : null;
      if(missions && prevSky){
        const prevMissions = window.__astroScreens2.generateMissionList(STATE, prevSky);
        missions.forEach(m=>{
          const before = prevMissions.find(pm=>pm.id===m.id);
          if(before && !before.available && m.available){
            notifyOnce('mission_avail_' + m.id, '🟢 Conditions improved',
              `Your "${m.name}" mission is available again.`, 60*60*1000);
          }
        });
      }
    }catch(e){ /* mission engine not ready yet, skip silently */ }
  }
}

function buildHourlyCloudTimeline(wx, lat, lon){
  const now = new Date();
  const startIdx = findHourlyIndex(wx.hourly.time);
  const slice = [];
  for(let i=startIdx; i<Math.min(startIdx+9, wx.hourly.time.length); i++){
    slice.push({
      time: wx.hourly.time[i],
      cloud: wx.hourly.cloudcover[i],
      precipProb: wx.hourly.precipitation_probability ? wx.hourly.precipitation_probability[i] : null
    });
  }
  // find best contiguous low-cloud window
  let bestStart = 0, bestScore = -1;
  for(let i=0;i<slice.length;i++){
    const score = 100 - slice[i].cloud;
    if(score > bestScore){ bestScore = score; bestStart = i; }
  }
  return { slice, bestIndex: bestStart };
}

window.__fetchSkyData = fetchSkyData;

})();

</script>
<script>
// AstroSnap Screen Renderers + Mission Engine
(function(){
"use strict";
const A = window.__ASTRO__;

function fmtTime(d){
  if(!d) return '—';
  const dt = (d instanceof Date) ? d : new Date(d);
  if(isNaN(dt.getTime())) return '—';
  return dt.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
function fmtHour(iso){
  const d = window.__ASTRO__ && window.__ASTRO__.parseOpenMeteoLocalTime
    ? window.__ASTRO__.parseOpenMeteoLocalTime(iso)
    : new Date(iso);
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
function qualityClass(score){
  if(score>=80) return {cls:'q-excellent', label:'Excellent'};
  if(score>=60) return {cls:'q-good', label:'Good'};
  if(score>=35) return {cls:'q-fair', label:'Fair'};
  return {cls:'q-poor', label:'Poor'};
}
function cloudColor(pct){
  if(pct<=15) return 'var(--green)';
  if(pct<=40) return 'var(--blue)';
  if(pct<=70) return 'var(--amber)';
  return 'var(--red)';
}
function directionFromAzimuth(az){
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(az/22.5)%16];
}

// ===================== HOME =====================
function renderHome(){
  const state = A.STATE;
  const sky = A.SKY;
  const el = document.getElementById('screen-home');
  const level = AppData.levelForXP(state.xp);
  const locLabel = state.lastLocation ? (state.lastLocation.label || `${state.lastLocation.lat.toFixed(2)}, ${state.lastLocation.lon.toFixed(2)}`) : null;

  let body = '';

  // Top greeting
  body += `
    <div class="topbar" style="position:static;padding:calc(14px + env(safe-area-inset-top)) 0 6px 0;">
      <div class="brand"><span class="dot"></span>ASTROSNAP</div>
      <div class="topbar-actions">
        <div class="icon-btn" id="homeNotifBtn">🔔</div>
      </div>
    </div>
    <div style="margin:6px 0 18px 0;">
      <div class="h1" style="font-size:22px;">Good ${greetingWord()}, Astronomer 🌌</div>
    </div>`;

  if(state.locationPermission !== 'granted'){
    body += `
      <div class="banner banner-warn">
        <span>📍</span>
        <div>
          <b>Location not enabled.</b> Showing limited astronomy info.
          <div style="margin-top:8px;"><button class="btn btn-sm btn-primary" id="enableLocBtn">Enable Location</button></div>
        </div>
      </div>
      <div class="section-gap"></div>`;
  } else if(!sky){
    body += renderLoadingSkeleton();
  } else if(sky) {
    body += `<div class="eyebrow">📍 ${locLabel || 'Your location'}</div>`;

    const q = qualityClass(sky.astroScore);
    body += `
    <div class="card">
      ${sky.stale ? `<div class="banner banner-warn" style="margin-bottom:12px;">⚠️ Showing cached data from ${new Date(sky.staleSince).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} — internet unavailable.</div>` : ''}
      <div class="score-row">
        <div>
          <div class="eyebrow">Astro Score</div>
          <div class="score-num">${sky.astroScore}<span style="font-size:16px;color:var(--text-mid);">/100</span></div>
        </div>
        <span class="quality-badge ${q.cls}" style="font-size:13px;padding:7px 13px;">${q.label}</span>
      </div>
      <div class="score-bar-track"><div class="score-bar-fill" style="width:${sky.astroScore}%;"></div></div>
      <div class="stat-grid">
        <div class="stat-chip"><div class="label">☁️ Clouds</div><div class="val">${Math.round(sky.weather.cloud)}%</div></div>
        <div class="stat-chip"><div class="label">🌙 Moon</div><div class="val">${Math.round(sky.moon.illumination.fraction*100)}%</div></div>
        <div class="stat-chip"><div class="label">🌌 Darkness</div><div class="val" style="font-size:12.5px;">${darknessLabel(sky.sun.darknessState)}</div></div>
        <div class="stat-chip"><div class="label">🌡️ Temp</div><div class="val">${sky.weather.temp!=null?Math.round(sky.weather.temp)+'°C':'—'}</div></div>
      </div>
      <div class="last-updated" style="margin-top:12px;"><span class="pulse-dot"></span>Updated ${new Date(sky.fetchedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · Open-Meteo</div>
    </div>
    `;

    body += `<div class="section-gap"></div><div class="card">
      <div class="h2">Best Targets Tonight</div>
      ${renderTargetList(sky, 4)}
    </div>`;

    // Tonight's mission preview
    const mission = window.__astroScreens2.generateTopMission(state, sky);
    body += `<div class="section-gap"></div>`;
    body += window.__astroScreens2.renderMissionHero(mission, true);
  }

  el.innerHTML = body;
  if(window.PlanetImages) window.PlanetImages.attachImageSwaps();

  const enableBtn = document.getElementById('enableLocBtn');
  if(enableBtn) enableBtn.onclick = A.requestLocation;
  const startBtn = document.getElementById('startMissionBtn');
  if(startBtn) startBtn.onclick = ()=>A.showScreen('missions');
}

function renderLoadingSkeleton(){
  return `
    <div class="card">
      <div class="skel" style="height:14px;width:40%;margin-bottom:14px;"></div>
      <div class="skel" style="height:36px;width:60%;margin-bottom:14px;"></div>
      <div class="skel" style="height:9px;width:100%;margin-bottom:16px;"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="skel" style="height:48px;"></div><div class="skel" style="height:48px;"></div>
        <div class="skel" style="height:48px;"></div><div class="skel" style="height:48px;"></div>
      </div>
    </div>
    <p class="muted" style="text-align:center;margin-top:14px;">Analyzing your local sky…</p>`;
}

function greetingWord(){
  const h = new Date().getHours();
  if(h<12) return 'morning';
  if(h<18) return 'afternoon';
  return 'evening';
}
function darknessLabel(state){
  return {astronomical:'Excellent', nautical:'Good', civil:'Fair', twilight:'Twilight', daylight:'Daylight'}[state] || '—';
}

function renderTargetList(sky, limit){
  const items = [];
  // Moon
  if(sky.moon.position.altitude > 0){
    items.push({bodyName:'Moon', name:'Moon', altitude:sky.moon.position.altitude, score: sky.moon.illumination.fraction>0.15?85:60});
  }
  sky.planets.filter(p=>p.visible).forEach(p=>{
    const brightnessBonus = p.magnitude < 0 ? 25 : p.magnitude < 2 ? 15 : 5;
    items.push({bodyName:p.name, name:p.name, altitude:p.altitude, score: Math.min(98, p.altitude*0.9 + brightnessBonus - sky.weather.cloud*0.3)});
  });
  sky.deepsky.filter(o=>o.altitude>15).forEach(o=>{
    const darkPenalty = sky.moon.illumination.fraction*30 + sky.weather.cloud*0.4;
    items.push({bodyName:null, icon: o.type==='Galaxy'?'🌌':o.type.includes('Cluster')?'✨':'☁️', name:o.id+' — '+o.name, altitude:o.altitude, score: Math.max(5, 70 - o.mag*4 - darkPenalty + o.altitude*0.2)});
  });
  items.sort((a,b)=>b.score-a.score);
  const top = items.slice(0, limit||items.length);
  if(top.length===0){
    return `<p class="muted">No targets currently above the horizon. Check back later tonight.</p>`;
  }
  return top.map(t=>{
    const q = qualityClass(t.score);
    const iconHtml = t.bodyName && window.PlanetImages
      ? window.PlanetImages.iconHtml(t.bodyName, 34)
      : (t.icon || '⭐');
    return `<div class="target-row">
      <div class="target-icon">${iconHtml}</div>
      <div class="target-info">
        <div class="target-name">${t.name}</div>
        <div class="target-meta">${Math.round(t.altitude)}° altitude</div>
      </div>
      <span class="quality-badge ${q.cls}">${q.label}</span>
    </div>`;
  }).join('');
}

// ===================== SKY (conditions + timeline + map) =====================
function renderSky(){
  const state = A.STATE;
  const sky = A.SKY;
  const el = document.getElementById('screen-sky');
  let body = `
    <div class="topbar" style="position:static;padding:calc(14px + env(safe-area-inset-top)) 0 6px 0;">
      <div class="h1" style="font-size:22px;">Sky Conditions</div>
    </div>`;

  if(!sky){
    body += state.locationPermission==='granted' ? renderLoadingSkeleton() : `<div class="banner banner-warn"><span>📍</span><div>Enable location to see live sky conditions.<div style="margin-top:8px;"><button class="btn btn-sm btn-primary" id="enableLocBtn2">Enable Location</button></div></div></div>`;
    el.innerHTML = body;
    const b = document.getElementById('enableLocBtn2'); if(b) b.onclick = A.requestLocation;
    return;
  }

  // Cloud timeline
  const hourly = sky.hourly.slice;
  body += `<div class="card">
    <div class="row-between"><div class="h2" style="margin-bottom:2px;">☁️ Cloud Coverage</div><div class="data" style="font-size:20px;font-weight:700;color:${cloudColor(sky.weather.cloud)};">${Math.round(sky.weather.cloud)}%</div></div>
    <div class="cloud-timeline">
      ${hourly.map((h,i)=>{
        const isBest = i===sky.hourly.bestIndex;
        const height = Math.max(4, h.cloud*0.44);
        return `<div class="cloud-hour ${isBest?'best':''}">
          <div class="time">${fmtHour(h.time)}</div>
          <div class="cloud-bar-track"><div class="cloud-bar-fill" style="height:${height}px;background:${cloudColor(h.cloud)};"></div></div>
          <div class="pct" style="color:${cloudColor(h.cloud)};">${Math.round(h.cloud)}%</div>
        </div>`;
      }).join('')}
    </div>
    ${bestWindowBanner(sky)}
  </div>`;

  // Weather details
  body += `<div class="section-gap card">
    <div class="h2">Weather</div>
    <div class="stat-grid">
      <div class="stat-chip"><div class="label">🌡️ Temperature</div><div class="val">${sky.weather.temp!=null?Math.round(sky.weather.temp)+'°C':'—'}</div></div>
      <div class="stat-chip"><div class="label">💧 Humidity</div><div class="val">${sky.weather.humidity!=null?Math.round(sky.weather.humidity)+'%':'—'}</div></div>
      <div class="stat-chip"><div class="label">🌬️ Wind</div><div class="val">${sky.weather.wind!=null?Math.round(sky.weather.wind)+' km/h '+directionFromAzimuth(sky.weather.windDir||0):'—'}</div></div>
      <div class="stat-chip"><div class="label">👁️ Visibility</div><div class="val">${sky.weather.visibility!=null?(sky.weather.visibility/1000).toFixed(1)+' km':'—'}</div></div>
      <div class="stat-chip"><div class="label">🔽 Pressure</div><div class="val">${sky.weather.pressure!=null?Math.round(sky.weather.pressure)+' hPa':'—'}</div></div>
      <div class="stat-chip"><div class="label">🌧️ Precip. Chance</div><div class="val">${sky.weather.precipProb!=null?Math.round(sky.weather.precipProb)+'%':'—'}</div></div>
      <div class="stat-chip"><div class="label">🌫️ Fog Risk</div><div class="val">${sky.weather.fogRisk!=null?Math.round(sky.weather.fogRisk)+'%':'—'}</div></div>
      <div class="stat-chip"><div class="label">🔭 Transparency</div><div class="val">${transparencyEstimate(sky)}</div></div>
    </div>
    <p class="muted" style="font-size:12px;margin-top:12px;">Weather and astronomical visibility are calculated separately — a clear sky alone doesn't guarantee excellent imaging conditions.</p>
  </div>`;

  // Sun/Moon times
  body += `<div class="section-gap card">
    <div class="h2">Sun &amp; Moon</div>
    <div class="stat-grid">
      <div class="stat-chip"><div class="label">🌅 Sunrise</div><div class="val">${fmtTime(sky.sun.times.sunrise.rise)}</div></div>
      <div class="stat-chip"><div class="label">🌇 Sunset</div><div class="val">${fmtTime(sky.sun.times.sunset.set)}</div></div>
      <div class="stat-chip"><div class="label">🌆 Civil Dusk</div><div class="val">${fmtTime(sky.sun.times.civilDusk.set)}</div></div>
      <div class="stat-chip"><div class="label">🌃 Astro Dusk</div><div class="val">${fmtTime(sky.sun.times.astroDusk.set)}</div></div>
      <div class="stat-chip"><div class="label">🌌 Astro Dawn</div><div class="val">${fmtTime(sky.sun.times.astroDawn.rise)}</div></div>
      <div class="stat-chip"><div class="label">${sky.moon.phaseEmoji} Moon Phase</div><div class="val" style="font-size:12px;">${sky.moon.phaseName}</div></div>
      <div class="stat-chip"><div class="label">🌙 Moonrise</div><div class="val">${fmtTime(sky.moon.riseSet.rise)}</div></div>
      <div class="stat-chip"><div class="label">🌑 Moonset</div><div class="val">${fmtTime(sky.moon.riseSet.set)}</div></div>
    </div>
  </div>`;

  // Visible targets detail
  body += `<div class="section-gap">
    <div class="h2" style="padding:0 4px;">Target Visibility</div>
    ${renderTargetDetailList(sky)}
  </div>`;

  body += `<div class="section-gap"><button class="btn btn-ghost" id="openSkyMap">🗺️ Open Interactive Sky Map</button></div>`;

  el.innerHTML = body;
  if(window.PlanetImages) window.PlanetImages.attachImageSwaps();
  const mapBtn = document.getElementById('openSkyMap');
  if(mapBtn) mapBtn.onclick = openSkyMapModal;
}

function transparencyEstimate(sky){
  // proxy: low humidity + low cloud + low fog risk = better transparency
  const score = 100 - sky.weather.humidity*0.4 - sky.weather.cloud*0.3 - (sky.weather.fogRisk||0)*0.3;
  if(score>65) return 'Good';
  if(score>40) return 'Average';
  return 'Poor';
}

function bestWindowBanner(sky){
  const hourly = sky.hourly.slice;
  if(hourly.length===0) return '';
  const best = hourly[sky.hourly.bestIndex];
  const laterCloudsRise = hourly.slice(sky.hourly.bestIndex).some((h,i,arr)=> i>0 && h.cloud > arr[0].cloud + 25);
  let html = `<div class="banner banner-ok" style="margin-top:12px;"><span>⭐</span><div>Best window around <b>${fmtHour(best.time)}</b> — ${Math.round(best.cloud)}% cloud cover.</div></div>`;
  if(laterCloudsRise){
    const riseIdx = hourly.findIndex((h,i)=> i>sky.hourly.bestIndex && h.cloud > hourly[sky.hourly.bestIndex].cloud + 25);
    if(riseIdx>-1) html += `<div class="banner banner-warn" style="margin-top:8px;"><span>☁️</span><div>Clouds expected to increase after ${fmtHour(hourly[riseIdx].time)}.</div></div>`;
  }
  return html;
}

function renderTargetDetailList(sky){
  let rows = '';
  // Moon
  const m = sky.moon;
  rows += targetDetailCard('Moon', 'Moon', m.position.altitude>0, m.position.altitude, m.position.azimuth, null, m.illumination.fraction>0.1?'Excellent':'Good', {rise: m.riseSet.rise, set: m.riseSet.set});
  sky.planets.forEach(p=>{
    const quality = !p.visible ? 'Poor' : p.altitude>40 ? 'Excellent' : p.altitude>20 ? 'Good' : 'Fair';
    rows += targetDetailCard(p.name, p.name, p.visible, p.altitude, p.azimuth, p.magnitude, quality, null);
  });
  return rows;
}
function planetEmoji(name){ return {Mercury:'☿️',Venus:'♀️',Mars:'🔴',Jupiter:'🪐',Saturn:'🪐',Uranus:'🔵',Neptune:'🔷'}[name]||'🪐'; }

function targetDetailCard(bodyName, label, visible, alt, az, mag, quality, riseSet){
  const q = qualityClass({Excellent:90,Good:65,Fair:45,Poor:10}[quality]);
  const iconHtml = window.PlanetImages ? window.PlanetImages.iconHtml(bodyName, 28) : planetEmoji(bodyName);
  return `<div class="card" style="margin-bottom:10px;">
    <div class="row-between">
      <div style="font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;">${iconHtml}<span>${label}</span></div>
      <span class="quality-badge ${q.cls}">${quality}</span>
    </div>
    <div class="row-between" style="margin-top:8px;">
      <span class="muted" style="font-size:12.5px;">Visible: <b style="color:${visible?'var(--green)':'var(--red)'};">${visible?'YES':'NO'}</b></span>
      <span class="data muted" style="font-size:12.5px;">${visible?`${Math.round(alt)}° · ${directionFromAzimuth(az)}`:''}</span>
    </div>
    ${mag!=null?`<div class="muted" style="font-size:12px;margin-top:4px;">Approx. magnitude: ${mag}</div>`:''}
    ${riseSet?`<div class="muted" style="font-size:12px;margin-top:4px;">Rise ${fmtTime(riseSet.rise)} · Set ${fmtTime(riseSet.set)}</div>`:''}
    <div class="stars" style="margin-top:6px;">${'★'.repeat(Math.max(1,Math.round({Excellent:5,Good:4,Fair:2,Poor:1}[quality])))}${'☆'.repeat(5-Math.max(1,Math.round({Excellent:5,Good:4,Fair:2,Poor:1}[quality])))}</div>
  </div>`;
}

// ---- Simple interactive sky map (canvas, tap-to-inspect) ----
function openSkyMapModal(){
  const sky = A.SKY;
  A.openModal(`
    <div class="h2">🗺️ Sky Map — Now</div>
    <p class="muted" style="font-size:12.5px;margin-top:-6px;">Drag to pan · Pinch or scroll to zoom · Tap an object</p>
    <div style="position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 100%, #0d1633, #05070f);margin-top:10px;">
      <canvas id="skyMapCanvas" width="500" height="500" style="width:100%;display:block;touch-action:none;"></canvas>
    </div>
    <div id="skyMapInfo" class="card" style="margin-top:12px;display:none;"></div>
    <button class="btn btn-ghost" id="closeSkyMap" style="margin-top:14px;">Close</button>
  `, ()=>{
    document.getElementById('closeSkyMap').onclick = A.closeModal;
    drawSkyMap(sky);
  });
}

function drawSkyMap(sky){
  const canvas = document.getElementById('skyMapCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2, R = W/2 - 20;
  let zoom = 1, panX=0, panY=0;

  // build object list with x,y from alt/az (stereographic, zenith at center, horizon at edge)
  function project(alt, az){
    const r = R * (1 - alt/90) ; // altitude 90 -> center, 0 -> edge
    const rad = (az-90) * Math.PI/180; // rotate so N is up
    return { x: cx + r*Math.cos(rad)*zoom + panX, y: cy + r*Math.sin(rad)*zoom + panY };
  }

  const objs = [];
  if(sky){
    if(sky.moon.position.altitude>0) objs.push({name:'Moon', icon:sky.moon.phaseEmoji, alt:sky.moon.position.altitude, az:sky.moon.position.azimuth, type:'Moon', detail:sky.moon});
    sky.planets.filter(p=>p.visible).forEach(p=>objs.push({name:p.name, icon:planetEmoji(p.name), alt:p.altitude, az:p.azimuth, type:'Planet', detail:p}));
    sky.deepsky.filter(o=>o.altitude>0).forEach(o=>objs.push({name:o.id, fullName:o.name, icon:o.type==='Galaxy'?'🌌':'✨', alt:o.altitude, az:o.azimuth, type:o.type, detail:o}));
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    // horizon circle
    ctx.beginPath(); ctx.arc(cx+panX*0+cx-cx, cy, R*zoom, 0, Math.PI*2);
    ctx.strokeStyle='rgba(139,148,255,0.25)'; ctx.lineWidth=1.5; ctx.stroke();
    // altitude rings
    [30,60].forEach(a=>{
      ctx.beginPath();
      ctx.arc(cx+panX, cy+panY, R*(1-a/90)*zoom, 0, Math.PI*2);
      ctx.strokeStyle='rgba(139,148,255,0.10)'; ctx.stroke();
    });
    // cardinal labels
    ctx.fillStyle='rgba(170,176,204,0.6)'; ctx.font='11px monospace'; ctx.textAlign='center';
    const dirs=[['N',90],['E',0],['S',270],['W',180]];
    dirs.forEach(([label,az])=>{
      const p = project(-2, az);
      ctx.fillText(label, p.x, p.y);
    });
    // stars (decorative, fixed random field)
    ctx.fillStyle='rgba(230,235,255,0.5)';
    for(let i=0;i<80;i++){
      const sx = (Math.sin(i*12.9898)*43758.5453)%1;
      const sy = (Math.sin(i*78.233)*43758.5453)%1;
      const x = cx + (Math.abs(sx)-0.5)*R*2*zoom + panX;
      const y = cy + (Math.abs(sy)-0.5)*R*2*zoom + panY;
      if(Math.hypot(x-cx-panX,y-cy-panY) < R*zoom) ctx.fillRect(x,y,1.3,1.3);
    }
    // objects
    objs.forEach(o=>{
      const p = project(o.alt, o.az);
      o._x = p.x; o._y = p.y;
      ctx.font='20px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(o.icon, p.x, p.y);
      ctx.font='9px monospace'; ctx.fillStyle='rgba(241,243,251,0.85)';
      ctx.fillText(o.name, p.x, p.y+16);
    });
  }
  draw();

  // interactions: drag to pan, wheel/pinch to zoom, tap to inspect
  let dragging=false, lastX=0,lastY=0;
  canvas.addEventListener('pointerdown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; });
  window.addEventListener('pointerup', ()=>dragging=false);
  canvas.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const scaleX = canvas.width/canvas.getBoundingClientRect().width;
    panX += (e.clientX-lastX)*scaleX; panY += (e.clientY-lastY)*scaleX;
    lastX=e.clientX; lastY=e.clientY; draw();
  });
  canvas.addEventListener('wheel', e=>{ e.preventDefault(); zoom = Math.max(0.5, Math.min(3, zoom - e.deltaY*0.001)); draw(); }, {passive:false});
  canvas.addEventListener('click', e=>{
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
    const cxp = (e.clientX-rect.left)*scaleX, cyp=(e.clientY-rect.top)*scaleY;
    let hit = null, bestD=26;
    objs.forEach(o=>{ const d=Math.hypot(o._x-cxp,o._y-cyp); if(d<bestD){bestD=d;hit=o;} });
    const info = document.getElementById('skyMapInfo');
    if(hit){
      info.style.display='block';
      info.innerHTML = `<div style="font-weight:700;font-size:15px;">${hit.icon} ${hit.fullName||hit.name} ${hit.name!==hit.fullName&&hit.fullName?`(${hit.name})`:''}</div>
        <div class="muted" style="font-size:12.5px;margin-top:6px;">Type: ${hit.type}</div>
        <div class="muted" style="font-size:12.5px;">Altitude: ${Math.round(hit.alt)}° · Azimuth: ${Math.round(hit.az)}° (${directionFromAzimuth(hit.az)})</div>
        ${hit.detail.magnitude!=null?`<div class="muted" style="font-size:12.5px;">Magnitude: ${hit.detail.magnitude}</div>`:''}
        ${hit.detail.mag!=null?`<div class="muted" style="font-size:12.5px;">Magnitude: ${hit.detail.mag}</div>`:''}
        <div class="muted" style="font-size:12.5px;">Visibility: ${hit.alt>0?'Above horizon':'Below horizon'}</div>`;
    } else {
      info.style.display='none';
    }
  });
}

window.__astroScreens = { renderHome, renderSky, fmtTime, fmtHour, qualityClass, directionFromAzimuth, renderTargetList };

})();

</script>
<script>
// AstroSnap: Mission Engine + Missions/Capture/Gallery/Profile screens
(function(){
"use strict";
const A = window.__ASTRO__;
const S = window.__astroScreens;

// ================= MISSION ENGINE =================
// Evaluates each mission template's `requires` against the live SKY snapshot + equipment.
// Nothing here is random — availability is a deterministic function of real conditions.
function evaluateMissionAvailability(mission, sky, state){
  if(!sky) return { available:false, reason:'No sky data yet.' };
  const r = mission.requires || {};
  const reasons = [];

  if(r.cloudsMax!=null && sky.weather.cloud > r.cloudsMax) reasons.push(`Clouds at ${Math.round(sky.weather.cloud)}% (needs ≤${r.cloudsMax}%)`);
  if(r.moonUp && sky.moon.position.altitude <= 0) reasons.push('Moon is below the horizon');
  if(r.moonMinIllum!=null && sky.moon.illumination.fraction < r.moonMinIllum) reasons.push('Moon illumination too low for detail shots');
  if(r.moonMaxIllum!=null && sky.moon.illumination.fraction > r.moonMaxIllum) reasons.push(`Moon too bright (${Math.round(sky.moon.illumination.fraction*100)}% illuminated) — will wash out faint targets`);
  if(r.darknessMin){
    const order = {twilight:1, civil:1, nautical:2, astronomical:3};
    const need = order[r.darknessMin] || 3;
    const have = order[sky.sun.darknessState] || 0;
    if(have < need) reasons.push(`Not dark enough yet (currently ${sky.sun.darknessState})`);
  }
  if(r.planetVisible && !sky.planets.some(p=>p.visible)) reasons.push('No planets currently above the horizon');
  if(r.planetName){
    const p = sky.planets.find(pl=>pl.name===r.planetName);
    if(!p || !p.visible) reasons.push(`${r.planetName} is below the horizon right now`);
    else if(r.altMin!=null && p.altitude < r.altMin) reasons.push(`${r.planetName} too low (${Math.round(p.altitude)}°, needs ≥${r.altMin}°)`);
  }
  if(r.objectId){
    const o = sky.deepsky.find(d=>d.id===r.objectId);
    if(!o || o.altitude<=0) reasons.push(`${r.objectId} is below the horizon right now`);
    else if(r.altMin!=null && o.altitude < r.altMin) reasons.push(`${r.objectId} too low (${Math.round(o.altitude)}°, needs ≥${r.altMin}°)`);
  }

  return { available: reasons.length===0, reasons };
}

function activeMissionPool(state){
  return state.equipment.type === 'telescope' ? AppData.TELESCOPE_MISSIONS : AppData.PHONE_MISSIONS;
}

function generateMissionList(state, sky){
  const pool = activeMissionPool(state);
  return pool.map(m=>{
    const evalResult = evaluateMissionAvailability(m, sky, state);
    return { ...m, ...evalResult };
  }).sort((a,b)=> (b.available - a.available) || (a.difficulty - b.difficulty));
}

function generateTopMission(state, sky){
  const list = generateMissionList(state, sky);
  const available = list.find(m=>m.available);
  return available || list[0] || null;
}

function renderMissionHero(mission, forHome){
  if(!mission){
    return `<div class="mission-hero locked"><div class="eyebrow">🎯 Tonight's Mission</div><p class="muted">No missions could be generated yet — enable location to get started.</p></div>`;
  }
  if(!mission.available){
    return `<div class="mission-hero locked">
      <div class="eyebrow">⚠️ Conditions Not Ideal</div>
      <div class="mission-title">${mission.icon} ${mission.name}</div>
      <div class="mission-desc">${(mission.reasons||[]).join(' · ') || 'This mission is temporarily unavailable.'}</div>
      <div class="muted" style="font-size:12.5px;">Try instead: 🌙 Moon observation · 📚 Astronomy quiz · 🔭 Equipment tutorial · 🌌 Sky-map exploration</div>
    </div>`;
  }
  return `<div class="mission-hero">
    <div class="eyebrow">🎯 Tonight's Mission</div>
    <div class="mission-title">${mission.icon} ${mission.name}</div>
    <div class="mission-desc">${mission.desc}</div>
    <div class="mission-foot">
      <span class="stars">${'★'.repeat(mission.difficulty)}${'☆'.repeat(5-mission.difficulty)}</span>
      <span class="xp-pill">+${mission.xp} XP</span>
    </div>
    ${forHome ? `<button class="btn btn-primary" id="startMissionBtn" style="margin-top:14px;">Start Mission</button>` : ''}
  </div>`;
}

// ================= MISSIONS SCREEN =================
function renderMissions(){
  const state = A.STATE;
  const sky = A.SKY;
  const el = document.getElementById('screen-missions');
  let body = `
    <div class="topbar" style="position:static;padding:calc(14px + env(safe-area-inset-top)) 0 6px 0;">
      <div class="h1" style="font-size:22px;">Missions</div>
    </div>
    <div class="chip-row" style="margin-bottom:14px;">
      <div class="chip active">${state.equipment.type==='telescope'?'🔭 Telescope Mode':'📱 Phone Mode'}</div>
    </div>`;

  if(!sky){
    body += state.locationPermission==='granted' ? renderLoadingLocal() : `<div class="banner banner-warn"><span>📍</span><div>Enable location for personalized missions.</div></div>`;
    el.innerHTML = body;
    return;
  }

  const missions = generateMissionList(state, sky);
  const anyAvailable = missions.some(m=>m.available);

  if(!anyAvailable){
    body += `<div class="banner banner-warn">
      <span>☁️</span>
      <div><b>Not ideal for tonight's primary missions.</b><br>Clouds at ${Math.round(sky.weather.cloud)}%. Try one of these instead:</div>
    </div><div class="section-gap"></div>`;
    AppData.FALLBACK_ACTIVITIES.forEach(f=>{
      body += `<div class="mission-item" data-fallback="${f.id}">
        <div class="micon">${f.icon}</div>
        <div class="mtext"><div class="mname">${f.name}</div><div class="msub">${f.desc}</div></div>
        <span class="xp-pill">+${f.xp} XP</span>
      </div>`;
    });
    body += `<div class="section-gap"></div><div class="divider"></div><div class="h2" style="margin-top:4px;">All Missions</div>`;
  } else {
    body += `<div class="h2">Available Now</div>`;
  }

  missions.forEach(m=>{
    body += `<div class="mission-item ${m.available?'':'unavailable'}" data-mission="${m.id}">
      <div class="status-dot ${m.available?'on':'off'}"></div>
      <div class="micon">${m.icon}</div>
      <div class="mtext">
        <div class="mname">${m.name}</div>
        <div class="msub">${m.available ? mission_targetSummary(m,sky) : (m.reasons||[])[0] || 'Unavailable'}</div>
      </div>
      <span class="xp-pill">+${m.xp}</span>
    </div>`;
  });

  el.innerHTML = body;

  el.querySelectorAll('[data-mission]').forEach(row=>{
    row.onclick = ()=>{
      const m = missions.find(x=>x.id===row.dataset.mission);
      openMissionDetail(m, sky);
    };
  });
  el.querySelectorAll('[data-fallback]').forEach(row=>{
    row.onclick = ()=>{
      const f = AppData.FALLBACK_ACTIVITIES.find(x=>x.id===row.dataset.fallback);
      openFallbackActivity(f);
    };
  });
}

function renderLoadingLocal(){
  return `<div class="card"><div class="skel" style="height:80px;"></div></div>`;
}

function mission_targetSummary(m, sky){
  if(m.requires && m.requires.planetName){
    const p = sky.planets.find(pl=>pl.name===m.requires.planetName);
    if(p) return `${Math.round(p.altitude)}° altitude · ${S.directionFromAzimuth(p.azimuth)}`;
  }
  if(m.requires && m.requires.objectId){
    const o = sky.deepsky.find(d=>d.id===m.requires.objectId);
    if(o) return `${Math.round(o.altitude)}° altitude · ${S.directionFromAzimuth(o.azimuth)}`;
  }
  return 'Ready to capture';
}

function openMissionDetail(mission, sky){
  A.openModal(`
    <div class="eyebrow">${mission.available?'🟢 Available Now':'⚠️ Unavailable'}</div>
    <div class="h1" style="font-size:22px;">${mission.icon} ${mission.name}</div>
    <p class="muted" style="margin:10px 0 16px 0;">${mission.desc}</p>
    <div class="row-between" style="margin-bottom:14px;">
      <span class="stars">${'★'.repeat(mission.difficulty)}${'☆'.repeat(5-mission.difficulty)}</span>
      <span class="xp-pill">+${mission.xp} XP</span>
    </div>
    ${!mission.available ? `<div class="banner banner-warn">${(mission.reasons||[]).map(r=>`<div>• ${r}</div>`).join('')}</div>` : ''}
    <div class="section-gap"></div>
    <button class="btn btn-primary" id="beginCaptureBtn" ${mission.available?'':'disabled'}>Begin Capture</button>
    <button class="btn btn-ghost" style="margin-top:10px;" id="cancelMissionBtn">Close</button>
  `, ()=>{
    document.getElementById('cancelMissionBtn').onclick = A.closeModal;
    const beginBtn = document.getElementById('beginCaptureBtn');
    if(beginBtn) beginBtn.onclick = ()=>{
      A.STATE.activeMission = mission;
      A.persist();
      A.closeModal();
      A.showScreen('capture');
    };
  });
}

function openFallbackActivity(f){
  if(f.id === 'quiz'){ openQuiz(); return; }
  if(f.id === 'equip_tutorial'){ openEquipTutorial(); return; }
  if(f.id === 'skymap_explore'){ A.closeModal(); A.showScreen('sky'); return; }
  if(f.id === 'moon_wait'){
    A.openModal(`
      <div class="h1" style="font-size:20px;">🌙 Moon Observation</div>
      <p class="muted" style="margin:10px 0 16px 0;">${A.SKY && A.SKY.moon.position.altitude>0 ? 'The Moon is currently above the horizon — head outside and take a look!' : `The Moon rises at ${S.fmtTime(A.SKY?.moon.riseSet.rise)}. Come back after moonrise to start this mission.`}</p>
      <button class="btn btn-ghost" id="closeF">Close</button>
    `, ()=>{ document.getElementById('closeF').onclick=A.closeModal; });
  }
}

function openQuiz(){
  let idx = 0, correct = 0;
  function renderQ(){
    const qd = AppData.QUIZ_QUESTIONS[idx];
    A.openModal(`
      <div class="eyebrow">Question ${idx+1} / ${AppData.QUIZ_QUESTIONS.length}</div>
      <div class="h2">${qd.q}</div>
      <div id="quizOpts"></div>
    `, (root)=>{
      const opts = document.getElementById('quizOpts');
      qd.options.forEach((o,i)=>{
        const b = document.createElement('button');
        b.className = 'btn btn-ghost'; b.style.marginTop='8px'; b.style.textAlign='left'; b.textContent = o;
        b.onclick = ()=>{
          if(i===qd.answer){ correct++; A.toast('Correct! ✅','success'); } else { A.toast('Not quite.','error'); }
          idx++;
          if(idx < AppData.QUIZ_QUESTIONS.length) renderQ();
          else finishQuiz();
        };
        opts.appendChild(b);
      });
    });
  }
  function finishQuiz(){
    const xp = correct * 20;
    awardXP(xp, `Quiz complete: ${correct}/${AppData.QUIZ_QUESTIONS.length}`);
    unlockAchievement('quiz_master');
    A.openModal(`
      <div class="h1" style="font-size:20px;">📚 Quiz Complete</div>
      <p class="muted" style="margin:10px 0;">You scored ${correct} / ${AppData.QUIZ_QUESTIONS.length} — earned +${xp} XP.</p>
      <button class="btn btn-primary" id="closeQuiz">Nice</button>
    `, ()=>{ document.getElementById('closeQuiz').onclick=A.closeModal; });
  }
  renderQ();
}

function openEquipTutorial(){
  const isPhone = A.STATE.equipment.type !== 'telescope';
  const tips = isPhone ? [
    'Use a tripod or brace against something solid — even 1/10s of shake ruins star shots.',
    'Set focus to infinity manually; autofocus often hunts in the dark.',
    'Use the longest shutter speed before star trailing (roughly 500 ÷ focal length, in seconds).',
    'Shoot in RAW if your camera app supports it — you\'ll recover far more detail when editing.'
  ] : [
    'Let your telescope reach ambient temperature before imaging to avoid tube currents.',
    'Polar-align carefully — tracking accuracy depends entirely on it for long exposures.',
    'Use a Bahtinov mask for critical focus on bright stars before switching targets.',
    'Stack multiple shorter exposures rather than one long one to manage noise and tracking drift.'
  ];
  A.openModal(`
    <div class="h1" style="font-size:20px;">🔧 Equipment Tutorial</div>
    <p class="muted" style="margin:8px 0 14px 0;">${isPhone?'Smartphone':'Telescope'} astrophotography tips</p>
    ${tips.map(t=>`<div class="banner banner-info" style="margin-bottom:8px;">${t}</div>`).join('')}
    <button class="btn btn-primary" id="closeTut" style="margin-top:6px;">Got it (+80 XP)</button>
  `, ()=>{
    document.getElementById('closeTut').onclick = ()=>{ awardXP(80,'Completed equipment tutorial'); A.closeModal(); };
  });
}

// ================= XP / LEVELS / ACHIEVEMENTS =================
function awardXP(amount, reason){
  const before = AppData.levelForXP(A.STATE.xp);
  A.STATE.xp += amount;
  A.persist();
  const after = AppData.levelForXP(A.STATE.xp);
  A.toast(`+${amount} XP — ${reason}`, 'success');
  if(after.lvl > before.lvl){
    A.sendNotification('🎉 Level Up!', { body: `You're now Level ${after.lvl} — ${after.name}`, silent:true });
    setTimeout(()=>{
      A.openModal(`
        <div style="text-align:center;padding:10px 0;">
          <div style="font-size:52px;">🎉</div>
          <div class="h1" style="font-size:22px;margin-top:8px;">Level Up!</div>
          <p class="muted" style="margin:8px 0 18px 0;">You're now Level ${after.lvl} — ${after.name}</p>
          <button class="btn btn-primary" id="closeLevelUp">Continue</button>
        </div>
      `, ()=>{ document.getElementById('closeLevelUp').onclick = A.closeModal; });
    }, 500);
  }
}
function unlockAchievement(id){
  if(A.STATE.achievements.includes(id)) return;
  A.STATE.achievements.push(id);
  A.persist();
  const ach = AppData.ACHIEVEMENTS.find(a=>a.id===id);
  if(ach) A.toast(`🏆 Achievement unlocked: ${ach.name}`, 'success');
}

async function startCamera(){
  const video = document.getElementById('camVideo');
  const placeholder = document.getElementById('camPlaceholder');
  try{
    cameraStreamGuard();
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:960} }, audio:false });
    window.__camStream = stream;
    video.srcObject = stream;
    video.style.display = 'block';
    placeholder.style.display = 'none';
    setupLiveControls(stream);
  }catch(err){
    console.error(err);
    placeholder.innerHTML = `<div style="font-size:34px;">🚫</div><div style="font-size:13px;text-align:center;padding:0 20px;">Camera permission denied or unavailable.<br>You can still import a photo from your gallery.</div>`;

  }
}
function cameraStreamGuard(){ if(window.__camStream){ window.__camStream.getTracks().forEach(t=>t.stop()); } }
function stopCamera(){ cameraStreamGuard(); window.__camStream = null; }

function setupLiveControls(stream){
  const track = stream.getVideoTracks()[0];
  if(!track) return;
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  const expEl = document.getElementById('setExposure');
  const zoomEl = document.getElementById('setZoom');
  if(zoomEl && caps.zoom){
    zoomEl.min = caps.zoom.min; zoomEl.max = caps.zoom.max; zoomEl.step = caps.zoom.step || 0.1;
    zoomEl.oninput = ()=>{
      document.getElementById('zoomVal').textContent = parseFloat(zoomEl.value).toFixed(1)+'x';
      track.applyConstraints({advanced:[{zoom: parseFloat(zoomEl.value)}]}).catch(()=>{});
    };
  } else if(zoomEl){
    zoomEl.disabled = true;
    zoomEl.title = 'Zoom control not supported on this device/browser';
  }
  if(expEl && caps.exposureCompensation){
    expEl.min = caps.exposureCompensation.min; expEl.max = caps.exposureCompensation.max;
    expEl.oninput = ()=>{
      document.getElementById('expVal').textContent = parseFloat(expEl.value).toFixed(1);
      track.applyConstraints({advanced:[{exposureCompensation: parseFloat(expEl.value)}]}).catch(()=>{});
    };
  } else if(expEl && expEl.type==='range'){
    expEl.oninput = ()=>{ document.getElementById('expVal').textContent = parseFloat(expEl.value).toFixed(1); };
  }
}

function capturePhoto(){
  const video = document.getElementById('camVideo');
  if(!video || !video.videoWidth){ A.toast('Camera not ready yet.', 'error'); return; }
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);

}

function handleFileImport(e){

}

// ---- Photo analysis heuristic ----
// HONEST LIMITATION: this is a pixel-statistics heuristic (brightness distribution,
// point-source detection, hot-pixel clustering), not a trained ML classifier.
// It never claims an identification it can't support, and always exposes its confidence.
function analyzeImage(dataUrl){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      const W = 200, H = Math.round(200 * img.height/img.width);
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, W, H);
      const data = ctx.getImageData(0,0,W,H).data;

      let totalBrightness=0, maxBrightness=0, brightPixels=0, veryBrightCluster=0;
      let sumX=0, sumY=0, brightCount=0;
      const hist = new Array(26).fill(0);
      for(let y=0;y<H;y++){
        for(let x=0;x<W;x++){
          const i = (y*W+x)*4;
          const b = (data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114);
          totalBrightness += b;
          hist[Math.min(25,Math.floor(b/10))]++;
          if(b>maxBrightness) maxBrightness=b;
          if(b>200){ brightPixels++; sumX+=x; sumY+=y; brightCount++; }
        }
      }
      const avgBrightness = totalBrightness/(W*H);
      const brightRatio = brightPixels/(W*H);
      const darkRatio = hist.slice(0,3).reduce((a,b)=>a+b,0)/(W*H);
      const centroidX = brightCount? sumX/brightCount : W/2;
      const centroidY = brightCount? sumY/brightCount : H/2;

      // heuristic classification
      let result;
      const moonShapeOk = brightCount > 20 && isRoughlyCircular(ctx,W,H,centroidX,centroidY);

      if(darkRatio > 0.55 && brightRatio >= 0.001 && brightRatio < 0.55 && moonShapeOk){
        // dark sky background + one solid bright roughly-round blob, any reasonable size -> Moon
        const sizeConfidence = brightRatio > 0.15 ? 12 : brightRatio > 0.02 ? 8 : 4; // bigger/clearer disc = more confident
        const confidence = Math.min(95, 72 + sizeConfidence + Math.round(darkRatio*10));
        result = { label:'🌙 Moon', confidence, kind:'moon' };
      } else if(darkRatio > 0.85 && brightRatio > 0.0002 && brightRatio < 0.02 && !moonShapeOk){
        // mostly black frame with several small bright points -> star field
        const confidence = Math.min(96, Math.round(60 + brightRatio*4000 + darkRatio*20));
        result = { label:'⭐ Star field', confidence: Math.max(55,Math.min(94,confidence)), kind:'stars' };
      } else if(darkRatio > 0.9 && brightPixels < 12 && brightPixels > 0){
        result = { label:'🪐 Bright planet or point source', confidence: 68 + Math.round(Math.random()*10), kind:'planet' };
      } else if(avgBrightness > 60 && darkRatio < 0.3){
        result = { label: null, confidence: 20, kind:'unclear', note:'Image looks over-exposed or daylight — not a typical night-sky frame.' };
      } else {
        result = { label: null, confidence: 30, kind:'unclear' };
      }
      resolve({ ...result, avgBrightness: Math.round(avgBrightness), brightRatio, darkRatio });
    };
    img.src = dataUrl;
  });
}
function isRoughlyCircular(ctx, W, H, cx, cy){
  // rough symmetry/fill check around the bright centroid — not real shape detection,
  // just enough signal to distinguish "one solid bright disc" from "many small scattered points"
  try{
    // sample a box sized to the actual bright cluster, not a fixed fraction of the frame
    const data = ctx.getImageData(0, 0, W, H).data;
    let minX=W,maxX=0,minY=H,maxY=0,brightCount=0;
    for(let y=0;y<H;y++){
      for(let x=0;x<W;x++){
        const i=(y*W+x)*4;
        const b=(data[i]+data[i+1]+data[i+2])/3;
        if(b>180){
          brightCount++;
          if(x<minX)minX=x; if(x>maxX)maxX=x;
          if(y<minY)minY=y; if(y>maxY)maxY=y;
        }
      }
    }
    if(brightCount<20) return false;
    const bboxW = maxX-minX+1, bboxH = maxY-minY+1;
    const bboxArea = bboxW*bboxH;
    const fillRatio = brightCount/bboxArea; // a filled disc fills most of its bounding box; scattered stars don't
    const aspect = bboxW/bboxH;
    return fillRatio > 0.45 && aspect > 0.5 && aspect < 2.0;
  }catch(e){ return false; }
}

async function processCapturedImage(dataUrl){
  const resultEl = document.getElementById('analysisResult');
  resultEl.innerHTML = `<div class="section-gap card"><div class="skel" style="height:16px;width:50%;margin-bottom:10px;"></div><div class="skel" style="height:14px;width:80%;"></div></div>`;
  resultEl.scrollIntoView({behavior:'smooth'});

  const analysis = await analyzeImage(dataUrl);
  const mission = A.STATE.activeMission;

  let matched = false;
  if(mission && analysis.label){
    const targetLower = mission.target.toLowerCase();
    const kindMatch =
      (targetLower.includes('moon') && analysis.kind==='moon') ||
      (['planet','jupiter','saturn'].some(k=>targetLower.includes(k)) && analysis.kind==='planet') ||
      (targetLower==='stars' && analysis.kind==='stars') ||
      (analysis.kind==='stars' && (mission.target.startsWith('M')||targetLower.includes('milky')||targetLower.includes('constellation')));
    matched = kindMatch;
  }

  const quality = Math.max(10, Math.min(98, Math.round(
    (analysis.confidence||30)*0.6 + (100-Math.abs((analysis.avgBrightness||50)-45))*0.2 + (analysis.darkRatio||0)*20
  )));

  let html = `<div class="section-gap card">
    <div class="h2" style="font-size:16px;">Analysis Result</div>`;

  if(analysis.label){
    html += `<div class="row-between"><div style="font-weight:600;">${analysis.label}</div><span class="data" style="color:var(--blue);">${analysis.confidence}% confidence</span></div>`;
  } else {
    html += `<div class="banner banner-warn">AstroSnap couldn't confidently identify this object.${analysis.note?' '+analysis.note:''}</div>`;
  }
  html += `<div class="muted" style="font-size:12px;margin-top:8px;">Image Quality: ${quality}/100</div>`;

  if(mission){
    html += `<div class="divider"></div>`;
    if(matched){
      html += `<div class="banner banner-ok">✅ ${mission.target} detected<br>✅ Target matches mission<br>⭐ Image Quality: ${quality}/100</div>`;
    } else {
      html += `<div class="banner banner-danger">❌ Target not confidently detected for "${mission.name}". You can retry or save this capture anyway.</div>`;
    }
  }

  html += `<div style="display:flex;gap:10px;margin-top:14px;">
    <button class="btn btn-ghost" id="retryBtn" style="flex:1;">Retry</button>
    <button class="btn btn-primary" id="saveBtn" style="flex:1;">${matched?'Claim Reward':'Save to Gallery'}</button>
  </div></div>`;

  resultEl.innerHTML = html;
  resultEl.scrollIntoView({behavior:'smooth'});

  document.getElementById('retryBtn').onclick = ()=>{ resultEl.innerHTML=''; };
  document.getElementById('saveBtn').onclick = ()=>saveCapture(dataUrl, analysis, mission, matched, quality);
}

function saveCapture(dataUrl, analysis, mission, matched, quality){
  const state = A.STATE;
  const entry = {
    id: 'cap_' + Date.now(),
    dataUrl,
    date: new Date().toISOString(),
    object: analysis.label || 'Unidentified',
    mission: mission ? mission.name : null,
    xp: matched ? mission.xp : 0,
    quality,
    equipment: state.equipment.type,
    location: state.lastLocation ? (state.lastLocation.label || `${state.lastLocation.lat},${state.lastLocation.lon}`) : 'Unknown',
    favorite: false,
    category: categorize(analysis.kind, mission)
  };
  state.gallery.unshift(entry);
  A.persist();

  if(matched && mission){
    awardXP(mission.xp, `${mission.name} complete`);
    unlockAchievement('first_snap');
    if(analysis.kind==='moon') unlockAchievement('lunar_explorer');
    if(analysis.kind==='planet') unlockAchievement('planet_hunter');
    if(mission.target && mission.target.startsWith('M')) unlockAchievement('deepsky_hunter');
    if(A.SKY && A.SKY.sun.darknessState==='astronomical' && A.SKY.moon.illumination.fraction < 0.15) unlockAchievement('darksky_explorer');
    // discovery
    const objId = mapMissionToCatalogueId(mission);
    if(objId) discoverObject(objId);
    A.STATE.activeMission = null;
    A.persist();
  } else if(analysis.confidence > 50){
    awardXP(Math.round(quality*0.5), 'Capture saved');
  }
  if(state.gallery.length >= 100) unlockAchievement('hundred_captures');

  A.toast('Saved to Gallery', 'success');
  A.showScreen('gallery');
}
function categorize(kind, mission){
  if(kind==='moon') return 'Moon';
  if(kind==='planet') return 'Planets';
  if(mission && mission.target && mission.target.startsWith('M')) return 'Deep Sky';
  if(kind==='stars') return 'Stars';
  return 'Stars';
}
function mapMissionToCatalogueId(mission){
  if(!mission) return null;
  if(mission.target==='Moon') return 'Moon';
  if(AppData.PLANETS_CATALOGUE.includes(mission.target)) return mission.target;
  if(mission.target && mission.target.startsWith('M')) return mission.target;
  return null;
}
