    <div class="section-gap"><button class="btn btn-danger" id="resetBtn">Reset App Data</button></div>
  `;
  el.innerHTML = body;

  document.getElementById('editEquipBtn').onclick = openEquipmentEditor;
  const enableBtn = document.getElementById('enableLocProfile');
  if(enableBtn) enableBtn.onclick = A.requestLocation;
  document.getElementById('preciseToggle').onchange = (e)=>{ state.privacy.storePreciseCoords = e.target.checked; A.persist(); };
  document.getElementById('shareToggle').onchange = (e)=>{ state.privacy.shareWithServices = e.target.checked; A.persist(); A.toast(e.target.checked?'Weather lookups enabled.':'Weather lookups disabled — sky data will use cached values only.', 'info'); };
  document.getElementById('viewCatalogueBtn').onclick = openCatalogueModal;
  document.getElementById('resetBtn').onclick = ()=>{
    A.openModal(`<div class="h2">Reset all app data?</div><p class="muted">This deletes your XP, gallery, achievements, and equipment setup from this device. This cannot be undone.</p>
      <div style="display:flex;gap:10px;margin-top:14px;"><button class="btn btn-ghost" id="cancelReset" style="flex:1;">Cancel</button><button class="btn btn-danger" id="confirmReset" style="flex:1;">Reset</button></div>`,
      ()=>{
        document.getElementById('cancelReset').onclick = A.closeModal;
        document.getElementById('confirmReset').onclick = ()=>{
          localStorage.clear();
          location.reload();
        };
      });
  };
}

function openEquipmentEditor(){
  const state = A.STATE;
  const eq = state.equipment;
  A.openModal(`
    <div class="h2">Equipment Setup</div>
    <div class="field"><label>Type</label>
      <select id="eqType"><option value="phone" ${eq.type==='phone'?'selected':''}>📱 Phone</option><option value="telescope" ${eq.type==='telescope'?'selected':''}>🔭 Telescope</option></select>
    </div>
    <div class="field"><label>Phone model (optional)</label><input type="text" id="eqPhoneModel" value="${eq.phoneModel||''}" placeholder="e.g. Pixel 9 Pro"></div>
    <div class="field"><label>Camera (optional)</label><input type="text" id="eqCamera" value="${eq.camera||''}" placeholder="e.g. ZWO ASI533MC"></div>
    <div id="scopeFields" style="display:${eq.type==='telescope'?'block':'none'};">
      <div class="field"><label>Telescope</label><input type="text" id="eqTelescope" value="${eq.telescope||''}" placeholder="e.g. Celestron NexStar 8SE"></div>
      <div class="field"><label>Aperture (mm)</label><input type="number" id="eqAperture" value="${eq.aperture||''}"></div>
      <div class="field"><label>Focal length (mm)</label><input type="number" id="eqFocal" value="${eq.focalLength||''}"></div>
      <div class="field"><label>Mount</label><input type="text" id="eqMount" value="${eq.mount||''}" placeholder="e.g. EQ6-R Pro"></div>
      <div class="field"><label>Filters</label><input type="text" id="eqFilters" value="${eq.filters||''}" placeholder="e.g. UV/IR, Ha, OIII"></div>
    </div>
    <button class="btn btn-primary" id="saveEquip" style="margin-top:8px;">Save</button>
  `, ()=>{
    document.getElementById('eqType').onchange = (e)=>{ document.getElementById('scopeFields').style.display = e.target.value==='telescope'?'block':'none'; };
    document.getElementById('saveEquip').onclick = ()=>{
      const newType = document.getElementById('eqType').value;
      const wasPhone = eq.type !== 'telescope';
      eq.type = newType;
      eq.phoneModel = document.getElementById('eqPhoneModel').value;
      eq.camera = document.getElementById('eqCamera').value;
      if(newType==='telescope'){
        eq.telescope = document.getElementById('eqTelescope').value;
        eq.aperture = document.getElementById('eqAperture').value;
        eq.focalLength = document.getElementById('eqFocal').value;
        eq.mount = document.getElementById('eqMount').value;
        eq.filters = document.getElementById('eqFilters').value;
        if(wasPhone) unlockAchievement('telescope_convert');
      }
      A.persist();
      A.closeModal();
      A.toast('Equipment updated — missions refreshed.', 'success');
      if(A.__currentScreenName==='missions') renderMissions();
    };
  });
}

function openCatalogueModal(){
  const state = A.STATE;
  const allObjects = [
    ...AppData.PLANETS_CATALOGUE.map(p=>({id:p,name:p,icon:'🪐'})),
    {id:'Moon', name:'Moon', icon:'🌙'},
    ...AppData.DEEPSKY_CATALOGUE.map(d=>({id:d.id,name:`${d.id} — ${d.name}`,icon:d.type==='Galaxy'?'🌌':'✨'})),
    ...AppData.CONSTELLATIONS.map(c=>({id:c,name:c,icon:'✨'}))
  ];
  A.openModal(`
    <div class="h2">Astronomy Catalogue</div>
    <p class="muted" style="margin-top:-6px;">${state.discovered.length}/${AppData.TOTAL_CATALOGUE_SIZE} discovered</p>
    <div style="max-height:60vh;overflow-y:auto;margin-top:10px;">
      ${allObjects.map(o=>`<div class="target-row"><div class="target-icon">${state.discovered.includes(o.id)?o.icon:'🔒'}</div><div class="target-info"><div class="target-name" style="${state.discovered.includes(o.id)?'':'color:var(--text-low);'}">${state.discovered.includes(o.id)?o.name:'???'}</div></div></div>`).join('')}
    </div>
    <button class="btn btn-ghost" id="closeCat" style="margin-top:14px;">Close</button>
  `, ()=>{ document.getElementById('closeCat').onclick = A.closeModal; });
}

window.__astroScreens2 = { renderMissions, renderGallery, renderProfile, renderCapture, generateTopMission, generateMissionList, renderMissionHero, awardXP, unlockAchievement, discoverObject };

})();

</script>
<script>
// AstroSnap push client — push-client.js
//
// This is a SEPARATE, OPTIONAL layer on top of the in-app Notification API
// already in app.js. That existing code only works while the tab is open.
// This module adds real background push (works after the tab/browser is
// closed) but requires:
//   1. This file + sw.js served over HTTPS (or localhost) from your app's origin
//   2. A running backend (see /astrosnap-backend) reachable at PUSH_CONFIG.apiBaseUrl
//   3. PUSH_CONFIG.vapidPublicKey set to the value your backend prints from
//      generate_vapid_keys.py
//
// If any of that isn't set up, every function here fails gracefully with a
// clear toast — it never pretends background push is active when it isn't.

const PUSH_CONFIG = {
  // EDIT THESE two values before deploying:
  apiBaseUrl: 'https://astrosnap.onrender.com', // no trailing slash
  vapidPublicKey: 'BLgFL0JMr3IkjejqFps_lnu-sZ84XsIAuN-fKhga-h3BJKkD7ef1VnCPUsJi2SzijX_2ILa6ZsLpabEccVT7zk4'
};

const BackgroundPush = (() => {

  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  function getSubscriberId() {
    let id = localStorage.getItem('astrosnap_subscriber_id');
    if (!id) {
      id = 'sub_' + (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '_' + Math.random().toString(36).slice(2)));
      localStorage.setItem('astrosnap_subscriber_id', id);
    }
    return id;
  }

  // Mirror the small config the service worker needs into IndexedDB, since
  // service workers can't read localStorage. Called every time we
  // subscribe/update so pushsubscriptionchange (in sw.js) always has fresh data.
  function mirrorConfigToIndexedDB(config) {
    return new Promise((resolve) => {
      const req = indexedDB.open('astrosnap-push', 1);
      req.onupgradeneeded = () => { req.result.createObjectStore('config'); };
      req.onsuccess = () => {
        try {
          const tx = req.result.transaction('config', 'readwrite');
          tx.objectStore('config').put(config, 'pushConfig');
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        } catch (e) { resolve(false); }
      };
      req.onerror = () => resolve(false);
    });
  }

  function isSupported() {
    return 'serviceWorker' in navigator &&
      'PushManager' in window &&
      (location.protocol === 'https:' || location.hostname === 'localhost');
  }

  function configLooksReal() {
    return PUSH_CONFIG.apiBaseUrl &&
      !PUSH_CONFIG.apiBaseUrl.includes('your-astrosnap-backend.example.com') &&
      PUSH_CONFIG.vapidPublicKey &&
      PUSH_CONFIG.vapidPublicKey !== 'PASTE_YOUR_VAPID_PUBLIC_KEY_HERE';
  }

  async function registerServiceWorker() {
    if (!isSupported()) {
      throw new Error('Service workers / Push API not supported here, or not on HTTPS/localhost.');
    }
    // Relative path (not '/sw.js') so this works whether the app is hosted
    // at a domain root or in a subfolder (e.g. GitHub Pages project sites
    // like username.github.io/reponame/). An absolute '/sw.js' would look
    // for the file at the domain root and 404 in a subfolder deployment.
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    return reg;
  }

  async function subscribe(lat, lon) {
    if (!isSupported()) {
      return { ok: false, reason: 'unsupported' };
    }
    if (!configLooksReal()) {
      return { ok: false, reason: 'not_configured' };
    }

    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      return { ok: false, reason: 'permission_denied' };
    }

    let reg;
    try {
      reg = await registerServiceWorker();
    } catch (e) {
      return { ok: false, reason: 'sw_registration_failed', error: String(e) };
    }

    let subscription;
    try {
      subscription = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(PUSH_CONFIG.vapidPublicKey)
      });
    } catch (e) {
      return { ok: false, reason: 'push_subscribe_failed', error: String(e) };
    }

    const subscriberId = getSubscriberId();
    const body = {
      subscriberId,
      subscription: subscription.toJSON(),
      lat, lon,
      prefs: { notificationsEnabled: true }
    };

    try {
      const resp = await fetch(PUSH_CONFIG.apiBaseUrl + '/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!resp.ok) {
        const errJson = await resp.json().catch(()=>({}));
        return { ok: false, reason: 'backend_rejected', error: errJson.error || resp.status };
      }
    } catch (e) {
      return { ok: false, reason: 'backend_unreachable', error: String(e) };
    }

    await mirrorConfigToIndexedDB({
      apiBaseUrl: PUSH_CONFIG.apiBaseUrl,
      subscriberId, lat, lon,
      prefs: { notificationsEnabled: true }
    });

    localStorage.setItem('astrosnap_push_subscribed', 'true');
    return { ok: true };
  }

  async function unsubscribe() {
    const subscriberId = getSubscriberId();
    try {
      if ('serviceWorker' in navigator) {
        const reg = await navigator.serviceWorker.getRegistration();
        if (reg) {
          const sub = await reg.pushManager.getSubscription();
          if (sub) await sub.unsubscribe();
        }
      }
    } catch (e) { /* continue to backend cleanup regardless */ }

    if (configLooksReal()) {
      try {
        await fetch(PUSH_CONFIG.apiBaseUrl + '/unsubscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ subscriberId })
        });
      } catch (e) { /* backend might be down — local unsubscribe still counts */ }
    }
    localStorage.setItem('astrosnap_push_subscribed', 'false');
    return { ok: true };
  }

  function isSubscribed() {
    return localStorage.getItem('astrosnap_push_subscribed') === 'true';
  }

  return { isSupported, configLooksReal, subscribe, unsubscribe, isSubscribed, getSubscriberId };
})();

window.BackgroundPush = BackgroundPush;

</script>
